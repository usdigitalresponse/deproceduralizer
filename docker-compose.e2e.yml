# Local Postgres stack for development and e2e tests.
#
# The app talks to Postgres through Neon's HTTP driver, which cannot speak
# plain TCP. `neon-proxy` runs Neon's real proxy binary in front of Postgres
# so the unchanged driver works locally. Point the app at it with:
#
#   DATABASE_URL=postgres://postgres:postgres@db.localtest.me:5432/deproceduralizer_e2e
#   NEON_LOCAL_PROXY_URL=http://localhost:4444
#
# psql and the seed script connect directly:
#
#   E2E_DATABASE_URL_DIRECT=postgres://postgres:postgres@localhost:5432/deproceduralizer_e2e
#
# Usage:  docker compose -f docker-compose.e2e.yml up -d --wait
#         bash scripts/e2e-db-reset.sh
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deproceduralizer_e2e
    ports:
      - "${E2E_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deproceduralizer_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  neon-proxy:
    # Neon's proxy binary behind Caddy; serves the HTTP /sql endpoint the
    # @neondatabase/serverless driver uses, plus /v1 websockets.
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    platform: linux/amd64
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/deproceduralizer_e2e
    ports:
      - "${E2E_PROXY_PORT:-4444}:4444"
    depends_on:
      postgres:
        condition: service_healthy
