name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    # eslint-config-next 16 turned on the React Compiler hooks rules, which flag
    # ~60 pre-existing spots across 40+ files. Reported but not blocking until
    # that cleanup lands; flip this off afterwards.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - run: pnpm --filter web lint
        working-directory: frontend

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - run: pnpm typecheck
        working-directory: frontend

  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - run: pnpm -r run test
        working-directory: frontend

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The editable install exposes `scripts`, `lib` and `config` the way the
      # tests import them (see backend/pyproject.toml).
      - run: pip install -r backend/requirements.txt -e backend
      # LLM tests cost money and db tests need a populated database; both stay out of CI.
      # Leave DATABASE_URL unset: lib/db.py falls back cleanly, while a dummy URL
      # makes some tests attempt a real connection.
      - run: python -m pytest tests -m "not llm and not db" -q
        working-directory: backend

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Syntax errors and undefined names only. The backend has no ruff config yet,
      # so a full rule set would be a style gate rather than a correctness gate.
      - run: ruff check backend --select E9,F63,F7,F82 --output-format github

  e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The app reaches Postgres through the local Neon proxy (docker-compose.e2e.yml);
      # psql and the seed connect directly on the same URL.
      E2E_PG_PORT: "55432"
      DATABASE_URL: postgres://postgres:postgres@localhost:55432/deproceduralizer_e2e
      NEON_LOCAL_PROXY_URL: http://localhost:4444
      # Compile-time auth bypass, the same one Vercel previews get.
      NEXT_PUBLIC_VERCEL_ENV: preview
      # Throwaway password so all four auth tests run without a secret.
      SITE_PASSWORD: e2e-throwaway-password
      E2E_SITE_PASSWORD: e2e-throwaway-password
      E2E_SERVER: start
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Start Postgres and the Neon proxy
        run: docker compose -f docker-compose.e2e.yml up -d --wait --wait-timeout 180

      - name: Load schema and seed fixtures
        run: bash scripts/e2e-db-reset.sh

      - name: Check the proxy answers SQL over HTTP
        run: |
          curl -fsS -X POST "$NEON_LOCAL_PROXY_URL/sql" \
            -H "Neon-Connection-String: $DATABASE_URL" \
            -H 'Content-Type: application/json' \
            -d '{"query":"select count(*) as documents from regulatory_documents","params":[]}'
          echo

      # The build prerenders pages against the database, so it must run after seeding.
      - name: Build
        run: pnpm --filter web build
        working-directory: frontend

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend/apps/web

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: frontend/apps/web

      - name: Run smoke tests
        run: pnpm test:e2e
        working-directory: frontend/apps/web

      - name: Show database stack logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color --tail 200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/apps/web/playwright-report/
            frontend/apps/web/test-results/
          retention-days: 7
