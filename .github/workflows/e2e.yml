name: E2E Smoke Tests

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready
      - vercel.deployment.success

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: vercel/repository-dispatch/actions/checkout@main

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend/apps/web

      - name: Run smoke tests
        run: pnpm test:e2e
        working-directory: frontend/apps/web
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Report status to Vercel
        if: always()
        uses: vercel/repository-dispatch/actions/status@main
        with:
          name: E2E Smoke Tests
          conclusion: ${{ job.status }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/apps/web/playwright-report/
          retention-days: 7
