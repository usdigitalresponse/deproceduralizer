mandated_reports:
  updated_at: "2025-12-26"
  display_name: "Mandated Reports"
  db_issue_type: "mandated_reports"
  category: "Reporting"
  description: "Mandated reporting requirements"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "annual report"
    - "quarterly report"
    - "submit a report"
    - "file a report"
    - "reporting requirements"
    - "report to the"
    - "statistical report"
    - "publish a report"
  prompt:
    system: |
      You analyze regulations for MANDATED GOVERNMENT REPORT requirements.

      This section mandates that a government entity produce a report. Note the
      report's stated purpose, frequency, and recipient.

      Consider whether:
      (1) the report is likely actually produced,
      (2) anyone uses or reads the report,
      (3) the reporting frequency is appropriate, and
      (4) the information could be provided through other means (e.g., dashboard,
          existing data publications).

      SEVERITY GUIDANCE for mandated reports:
      - 7-10: Frequent (monthly+), detailed reports with high staff burden
      - 4-6: Periodic (quarterly/annual), moderate effort to produce
      - 1-3: Simple reports, minimal burden, or reports with clear value

      If a report requirement exists, flag it with appropriate severity.
      If no report requirement is found, explain why.

    template: |
      Analyze this regulation for mandated reporting requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Note the report's stated purpose, frequency, and recipient.


reporting_frequency:
  updated_at: "2026-02-20"
  display_name: "Excessive Reporting Frequency"
  db_issue_type: "reporting_frequency"
  category: "Reporting"
  description: "Reporting frequency disproportionate to risk or purpose"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "shall.{0,40}(report|submit|file|furnish).{0,40}(daily|weekly|biweekly|monthly|quarterly|semi-annual(?:ly)?|biennial|annually)"
    - "must.{0,40}(report|submit|file|furnish).{0,40}(daily|weekly|biweekly|monthly|quarterly|semi-annual(?:ly)?|biennial|annually)"
    - "required to.{0,40}(report|submit|file|furnish).{0,40}(daily|weekly|biweekly|monthly|quarterly|semi-annual(?:ly)?|biennial|annually)"
    - "(daily|weekly|biweekly|monthly|quarterly|semi-annual(?:ly)?|biennial).{0,40}(report|submission|filing|statement|return|survey|census)"
    - "report.{0,20}(daily|weekly|biweekly|monthly|quarterly|semi-annual(?:ly)?|biennial)"
  prompt:
    system: |
      You analyze regulations for EXCESSIVE REPORTING FREQUENCY requirements.

      This section contains a reporting requirement with a specified frequency. Evaluate
      whether the reporting frequency is proportionate to the regulatory risk or purpose
      being served.

      Note: The related "mandated_reports" issue type evaluates whether reports are useful.
      THIS issue type focuses specifically on whether the FREQUENCY is disproportionate —
      i.e., whether the same oversight goal could be achieved with less frequent reporting.

      This IS a compliance issue when:
      - Monthly or more frequent reporting is required for routine, low-risk matters
      - The reporting frequency creates significant staff burden relative to the oversight value
      - Less frequent reporting (e.g., quarterly instead of monthly) would provide adequate oversight
      - The same information is available through other channels (dashboards, audits)

      This is NOT a compliance issue when:
      - The frequency is proportionate to the risk (e.g., monthly financial reports for fiduciaries)
      - The reporting serves active safety monitoring that requires frequent updates
      - The frequency is quarterly or less for matters requiring ongoing oversight
      - Statute specifically mandates the frequency

      SEVERITY GUIDANCE:
      - 7-10: Monthly+ reports on routine/low-risk matters with high staff burden
      - 4-6: Quarterly reports that could reasonably be semi-annual or annual
      - 1-3: Reporting frequency is arguably appropriate but worth flagging for review

    template: |
      Analyze this regulation for excessive reporting frequency:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Evaluate whether the reporting frequency is proportionate to the risk or purpose.
      Consider the staff burden imposed relative to the oversight value gained.


# =============================================================================
# INCORPORATION BY REFERENCE
# =============================================================================

incorporation_by_reference:
  updated_at: "2025-12-26"
  # NOTE: This issue type uses a DEDICATED TABLE (incorporations_by_reference)
  # instead of compliance_issues table. See backend/scripts/ibr_scanner.py
  # Config is kept here for pattern/prompt reuse. GitHub issue #49.
  display_name: "Incorporation by Reference"
  db_issue_type: "incorporation_by_reference"
  category: "External Standards"
  description: "External standards, codes, or documents incorporated by reference"
  response_model: "IncorporationByReferenceAnalysis"
  patterns:
    # Core IBR language
    - "incorporated by reference"
    - "incorporated herein by reference"
    - "incorporated herein"
    - "adopts? by reference"
    - "adopted by reference"
    # Standards organizations (word boundaries)
    - "\\bNFPA\\b"
    - "\\bASTM\\b"
    - "\\bANSI\\b"
    - "\\bIEEE\\b"
    - "\\bAPI\\b"
    - "\\bUL\\b"
    # ICC codes
    - "International Building Code"
    - "International Fire Code"
    - "International Mechanical Code"
    - "International Plumbing Code"
    - "International Energy Conservation Code"
    - "International Residential Code"
  prompt:
    system: |
      You analyze regulations for INCORPORATION BY REFERENCE of external standards, codes, or documents.

      Incorporation by reference (IBR) occurs when a regulation adopts an external document
      (such as an industry standard, building code, or federal regulation) as part of its
      requirements, rather than restating the full text.

      This IS incorporation by reference when:
      - The regulation explicitly incorporates an external document (using phrases like
        "incorporated by reference", "adopted by reference", "incorporated herein")
      - The regulation requires compliance with a specific external standard (NFPA, ANSI,
        ASTM, ICC codes, etc.)
      - The regulation references a specific version/edition of an external document

      This is NOT incorporation by reference when:
      - The text merely mentions an organization without requiring compliance
      - The reference is to another section of the same regulation
      - The reference is purely definitional or explanatory
      - It's a citation to legal authority (like a statute) rather than an adopted standard

      For each incorporation found, identify:
      - incorporated_document: The full name of the document/standard (e.g., "NFPA 101 Life Safety Code", "International Building Code 2021")
      - source_organization: The publishing organization (e.g., "NFPA", "ICC", "ANSI", "ASTM", "CFR")
      - version: The version, year, or edition if specified (e.g., "2021", "2020 edition")

      Respond with:
      - has_issue: true if an external standard/code/document is incorporated by reference
      - requirement_quote: exact quote showing the incorporation
      - incorporated_document: name of the incorporated document
      - source_organization: publishing organization
      - version: version/year if specified
      - from_statute: true if the incorporation is required by statute, false if regulation adds it
      - notes: any additional context (e.g., which sections are incorporated, amendments)

    template: |
      Analyze this regulation for incorporation by reference of external standards:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Identify any external standards, codes, or documents that are incorporated by reference,
      and extract the document name, publishing organization, and version if available.


# =============================================================================
# ENFORCEMENT
# =============================================================================

fines_fees_penalties:
  updated_at: "2026-03-10"
  # NOTE: This issue type uses a DEDICATED TABLE (fines_fees_penalties)
  # instead of compliance_issues table. See backend/scripts/fines_scanner.py
  # Config is kept here for pattern/prompt reuse. Similar to IBR (issue #49).
  display_name: "Fines, Fees & Penalties"
  db_issue_type: "fines_fees_penalties"
  category: "Enforcement"
  description: "Monetary charges including fines, fees, penalties, surcharges, and forfeitures"
  response_model: "FinesFeePenaltyAnalysis"
  patterns:
    # --- High-precision: fine/penalty language (these rarely false-positive) ---
    - "\\bcivil penalty\\b"
    - "\\bcivil penalt(y|ies)\\b"
    - "\\bpenalty\\b"
    - "\\bpenalties\\b"
    - "\\bfine\\b"
    - "\\bfines\\b"
    - "\\bsurcharge\\b"
    - "\\bforfeiture\\b"
    - "per violation"
    - "per occurrence"
    - "monetary penalty"
    - "monetary fine"
    - "subject to a fine"
    - "shall be fined"
    - "shall pay a penalty"
    # --- Named fee types (high precision) ---
    - "fee schedule"
    - "\\bfiling fee\\b"
    - "\\blicense fee\\b"
    - "\\bapplication fee\\b"
    - "\\bregistration fee\\b"
    - "\\binspection fee\\b"
    - "\\bpermit fee\\b"
    - "\\brenewal fee\\b"
    - "\\blate fee\\b"
    - "\\bprocessing fee\\b"
    - "\\bassessment fee\\b"
    - "\\buser fee\\b"
    - "\\bservice fee\\b"
    # --- Compound patterns: dollar amount + penalty context (avoids bare $ matches) ---
    - "\\$\\s*[\\d,]+.{0,40}(?:fine|penalty|fee|surcharge|forfeiture|per violation|per occurrence|per day)"
    - "(?:fine|penalty|fee|surcharge|forfeiture).{0,40}\\$\\s*[\\d,]+"
    - "not to exceed\\s*\\$"
    - "not less than\\s*\\$"
    - "not more than\\s*\\$"
    - "\\$\\s*[\\d,]+\\s*per\\s*day"
  prompt:
    system: |
      You analyze regulations and guidance documents for FINES, FEES, AND PENALTIES
      that are IMPOSED, AUTHORIZED, OR REQUIRED BY the regulation itself.

      CRITICAL DISTINCTION: Only extract charges that the regulation CREATES, AUTHORIZES, or REQUIRES.
      Do NOT extract charges that are merely mentioned in passing, used as examples, or listed as
      categories in an accounting/budgeting context.

      For each regulatory charge found, extract:
      - penalty_type: One of "fine", "fee", "penalty", "surcharge", "forfeiture", "other"
      - amount: The dollar amount as stated (e.g., "$500", "up to $10,000", "$100-$500"). Non-monetary penalties (e.g., "6-month disqualification") go here too.
      - amount_min: The minimum numeric dollar amount if parseable (null if not monetary or not parseable)
      - amount_max: The maximum numeric dollar amount if parseable (null if not monetary or not parseable)
      - per_unit: What the amount is per (e.g., "per violation", "per day", "per occurrence", null if flat)
      - who_pays: Who is subject to this charge (e.g., "licensee", "applicant", "employer")
      - responsible_agency: The FULL OFFICIAL NAME of the government agency that administers or collects this charge.
        Use the agency name from the DOCUMENT METADATA section below if available.
        NEVER return generic terms like "Department", "Commission", "Commissioner", "Office", "Board", or "Agency" alone.
        Always include the full name (e.g., "Department of Environmental Conservation", not just "Department").
        If the specific agency cannot be determined from the text, use the agency from the document metadata.
      - agency_level: Government level of the responsible agency. One of:
        "federal", "state", "county", "city", "village", "town", "authority", "judiciary", "generic".
        Most NY regulatory agencies are "state". Use "federal" for U.S. agencies, "authority" for quasi-governmental bodies,
        "judiciary" for courts, and "generic" if the level cannot be determined.
      - violation_description: What triggers this fine/fee (brief description)
      - requirement_quote: Exact quote from the text establishing this charge

      Classification guidance:
      - "fee" = regulatory fee required for a license, permit, application, inspection, or government service
      - "fine" = punitive monetary charge for a violation
      - "penalty" = broader punitive charge (monetary or non-monetary like disqualification/suspension)
      - "surcharge" = additional charge on top of another fee/fine
      - "forfeiture" = loss of bond, deposit, or property as a regulatory consequence
      - "other" = doesn't fit neatly into above categories

      INCLUDE (set llm_confirmed=true):
      - Fines/penalties the regulation imposes for violations (e.g., "shall be subject to a civil penalty of $500 per violation")
      - Fees the regulation requires for permits, licenses, applications, inspections, filings
      - Fee schedules established by the regulation
      - Non-monetary penalties imposed by the regulation (disqualification, suspension, revocation)
      - Surcharges or forfeitures the regulation authorizes

      EXCLUDE (set llm_confirmed=false):
      - Fees merely mentioned as an accounting category (e.g., "conference fees" or "accreditation fees" in a budget list)
      - Dollar amounts that are budget thresholds, grant amounts, or spending limits (not charges)
      - Third-party charges not imposed by the regulation (e.g., "collection agency fees")
      - Passing references to fines/penalties without the regulation actually imposing them
      - Capital expenditure thresholds or revenue classifications

    template: |
      Analyze this regulatory text for fines, fees, and penalties that the REGULATION ITSELF
      imposes, authorizes, or requires. Do not extract fees that are merely mentioned in passing
      or listed as accounting categories.

      DOCUMENT METADATA:
      {document_metadata}

      TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      For each charge that the regulation creates or authorizes, extract structured data.
      Set llm_confirmed=false for items that are merely mentioned but not imposed by the regulation.


