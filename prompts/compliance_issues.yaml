check_payment:
  updated_at: "2025-12-26"
  display_name: "Check/Money Order Payment"
  db_issue_type: "check_payment"
  category: "Payment"
  description: "Check or money order payment required"
  response_model: "PaymentAnalysis"
  patterns:
    - "money order"
    - "certified check"
    - "cashier.{0,3}s? check"
    - "personal check"
    - "payable to"
  prompt:
    system: |
      You analyze regulations for CHECK/MONEY ORDER payment requirements.

      This section references payment by check or money order. Determine whether this
      is the ONLY permitted payment method, or whether credit card, debit card, ACH,
      or online payment options are also available.

      If modern electronic payment is equally permitted, this is a false positive.
      Flag only if check/money order appears to be required or is the only option.

      This IS a compliance issue when:
      - Check or money order is the ONLY payment method mentioned
      - Electronic payment methods are not offered as alternatives
      - The language suggests check/money order is required

      This is NOT a compliance issue when:
      - Check is one option among several including electronic payment
      - Credit card, debit, ACH, or online payment is also mentioned
      - The regulation just provides payment address without mandating method

      Respond with:
      - has_issue: true if check/money order is required or only option
      - requirement_quote: exact quote about the payment requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context

    template: |
      Analyze this regulation for check/money order payment requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether check/money order is the ONLY payment method, or whether
      electronic payment options are also available.


cash_only:
  updated_at: "2025-12-26"
  display_name: "Cash Only Payment"
  db_issue_type: "cash_only"
  category: "Payment"
  description: "Cash-only payment required"
  response_model: "PaymentAnalysis"
  patterns:
    - "cash.{0,5}only"
    - "exact change"
  prompt:
    system: |
      You analyze regulations for CASH-ONLY payment requirements.

      This section references cash payment. Confirm that cash is REQUIRED or is the
      only payment option, rather than simply being one of several accepted methods.

      If electronic payment methods are also accepted, this is a false positive.

      This IS a compliance issue when:
      - Cash is explicitly required ("cash only")
      - Exact change is required with no alternatives
      - No electronic or check payment options are mentioned

      This is NOT a compliance issue when:
      - Cash is one accepted method among several
      - Electronic payment is also available
      - The reference is incidental rather than a requirement

      Respond with:
      - has_issue: true if cash is required or only option
      - requirement_quote: exact quote about the cash requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context

    template: |
      Analyze this regulation for cash-only payment requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Confirm whether cash is REQUIRED or is the only payment option.


no_credit_cards:
  updated_at: "2025-12-26"
  display_name: "No Credit Cards"
  db_issue_type: "no_credit_cards"
  category: "Payment"
  description: "Credit cards explicitly not accepted"
  response_model: "PaymentAnalysis"
  patterns:
    - "no credit cards?"
    - "credit cards? not accepted"
    - "cash or check only"
    - "no electronic payment"
  prompt:
    system: |
      You analyze regulations for PROHIBITIONS ON ELECTRONIC PAYMENT.

      This section appears to prohibit or exclude electronic payment methods. Confirm
      that this is an active prohibition rather than outdated language that has been
      superseded by current practice.

      Flag if the prohibition appears to be in force.

      This IS a compliance issue when:
      - Credit/debit cards are explicitly prohibited
      - Electronic payment is explicitly excluded
      - Only cash or check are listed as accepted methods

      This is NOT a compliance issue when:
      - The language is clearly outdated or superseded
      - Other sections or current practice allow electronic payment
      - The prohibition is for a specific narrow purpose with rationale

      Respond with:
      - has_issue: true if electronic payment prohibition is active
      - requirement_quote: exact quote about the prohibition
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context

    template: |
      Analyze this regulation for credit/debit card prohibitions:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Confirm whether the prohibition on electronic payment is active.


in_person_payment:
  updated_at: "2025-12-26"
  display_name: "In-Person Payment"
  db_issue_type: "in_person_payment"
  category: "Payment"
  description: "Payment must be made in person"
  response_model: "PaymentAnalysis"
  patterns:
    - "pay in person"
    - "payment in person"
    - "in.{0,3}person.{0,10}payment"
  prompt:
    system: |
      You analyze regulations for IN-PERSON PAYMENT requirements.

      This section requires payment to be made in person. Determine whether there is
      a clear rationale for in-person payment (e.g., combined with a required in-person
      inspection or identity verification), or whether this is simply a legacy requirement.

      If online or mail-in payment would reasonably suffice, flag it.

      This IS a compliance issue when:
      - In-person payment is required without clear rationale
      - Online or mail payment would reasonably work
      - The in-person requirement appears to be legacy rather than purposeful

      This is NOT a compliance issue when:
      - In-person payment is combined with required inspection or ID verification
      - There is a stated rationale for physical presence
      - Online/mail payment is also offered as an alternative

      Respond with:
      - has_issue: true if in-person payment is required without clear rationale
      - requirement_quote: exact quote about the in-person payment requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context including rationale if present

    template: |
      Analyze this regulation for in-person payment requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether there is a clear rationale for in-person payment.


# =============================================================================
# SIGNATURES & AUTHENTICATION
# =============================================================================

wet_signature:
  updated_at: "2025-12-26"
  display_name: "Wet Signature"
  db_issue_type: "wet_signature"
  category: "Signatures"
  description: "Physical wet/ink signature required"
  response_model: "WetSignatureAnalysis"
  patterns:
    - "wet signature"
    - "ink signature"
    - "handwritten signature"
    - "original signature"
    - "signed in ink"
    - "blue ink"
    - "black ink"
    - "manually signed"
    - "physical signature"
    - "personally sign"
    - "notarized.{0,20}signature"
    - "signature.{0,20}notari"
    - "bear.{0,10}signature"
  prompt:
    system: |
      You analyze regulations for WET/HANDWRITTEN SIGNATURE requirements.

      This section references a signature requirement. Determine whether it specifically
      requires a handwritten/wet/original signature, or whether electronic signatures
      are also permitted.

      If electronic signatures (including typed names, e-signatures, or digital
      certificates) are accepted as alternatives, this is a false positive. Flag only
      if a physical ink signature appears to be required.

      IMPORTANT: A "wet signature" requirement means the text EXPLICITLY requires one of:
      - "wet signature"
      - "original signature"
      - "ink signature"
      - "handwritten signature"
      - "physical signature"
      - "signed in ink"
      - "manually signed"
      - Explicit prohibition of electronic/digital/fax signatures

      Generic phrases like "shall be signed", "must be signed", "signature required",
      or "bear the signature of" do NOT count as wet signature requirements. These
      allow electronic signatures under modern law (UETA, E-SIGN Act).

      Respond with:
      - has_issue: true ONLY if there is an EXPLICIT wet/ink/handwritten/original/physical requirement
      - requirement_quote: exact quote about the signature requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context

    template: |
      Analyze this regulation for wet signature requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether the regulation specifically requires a wet/handwritten signature
      or whether electronic signatures are permitted.


notarization:
  updated_at: "2026-03-05"
  display_name: "Notarization Required"
  db_issue_type: "notarization"
  category: "Signatures"
  description: "Notarization required"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "must be notarized"
    - "shall be notarized"
    - "duly notarized"
    - "\\bnotarized\\b"
    - "notary public"
    - "sworn.{0,20}before"
    - "acknowledged before"
    - "\\bjurat\\b"
  prompt:
    system: |
      You analyze regulations for NOTARIZATION requirements.

      This section requires notarization. Determine whether:
      (1) the notarization serves a clear legal purpose required by statute for this type of document,
      (2) remote online notarization is permitted as an alternative, or
      (3) the requirement appears to be administrative rather than legally mandated.

      IMPORTANT NY CONTEXT: New York authorized Remote Online Notarization (RON) effective
      January 31, 2023 under Executive Law §135-c. RON allows notarization via audio-video
      technology without physical presence. If a NY regulation requires notarization but does
      not mention RON as an alternative, this is a modernization gap — the regulation should
      be updated to reference RON availability. However, if the regulation explicitly permits
      RON or "remote notarization", the burden is significantly reduced.

      Flag if notarization appears to be an administrative addition rather than a
      statutory requirement, or if remote notarization is not mentioned as an option
      where it could apply.

      This IS a compliance issue when:
      - Notarization is required without clear statutory mandate
      - Remote online notarization is not mentioned as an alternative
      - The requirement appears to be administrative rather than legal necessity

      This is NOT a compliance issue when:
      - Statute specifically requires notarization for this document type
      - Remote online notarization is explicitly permitted
      - There is a clear anti-fraud or identity verification purpose

      Respond with:
      - has_issue: true if notarization appears administrative or remote not permitted
      - requirement_quote: exact quote about the notarization requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context

    template: |
      Analyze this regulation for notarization requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether notarization serves a clear legal purpose and whether
      remote notarization is permitted.


witness:
  updated_at: "2025-12-26"
  display_name: "Witness Required"
  db_issue_type: "witness"
  category: "Signatures"
  description: "Witness signature required"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "two witnesses"
    - "2 witnesses"
    - "witness.{0,5}signature"
    - "witnessed by"
    - "\\battested\\b"
    - "attestation"
    - "in the presence of"
  prompt:
    system: |
      You analyze regulations for WITNESS requirements.

      This section requires one or more witnesses. Determine whether the witness
      requirement is mandated by statute for this document type (e.g., certain
      contracts, wills), or whether it appears to be an administrative addition.

      Also note how many witnesses are required. Flag if the witness requirement
      appears discretionary or if the number of required witnesses seems excessive
      for the document type.

      This IS a compliance issue when:
      - Witness requirement is not mandated by statute
      - Number of witnesses seems excessive for the document type
      - The requirement appears to be administrative rather than legal necessity

      This is NOT a compliance issue when:
      - Statute specifically requires witnesses for this document type
      - The document type traditionally requires witnesses (wills, certain contracts)
      - There is a clear anti-fraud purpose

      Respond with:
      - has_issue: true if witness requirement appears discretionary or excessive
      - requirement_quote: exact quote about the witness requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: number of witnesses required and any context

    template: |
      Analyze this regulation for witness requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether the witness requirement is mandated by statute or appears
      to be an administrative addition.


embossed_seal:
  updated_at: "2025-12-26"
  display_name: "Embossed Seal/Stamp"
  db_issue_type: "embossed_seal"
  category: "Signatures"
  description: "Embossed or official seal required"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "embossed seal"
    - "raised seal"
    - "impressed seal"
    - "corporate seal"
    - "official seal"
    - "seal.{0,5}affixed"
  prompt:
    system: |
      You analyze regulations for PHYSICAL SEAL/STAMP requirements.

      This section requires a physical seal or stamp. Determine whether this is
      required by statute or whether a digital seal, electronic certification,
      or no seal at all would suffice.

      Flag if the physical seal requirement appears to be administrative rather
      than legally mandated.

      This IS a compliance issue when:
      - Physical seal is required without statutory mandate
      - Digital seal or electronic certification would suffice
      - The requirement appears to be formality rather than necessity

      This is NOT a compliance issue when:
      - Statute specifically requires physical seal for this document type
      - The seal serves a clear authentication purpose
      - Digital alternatives are explicitly permitted

      Respond with:
      - has_issue: true if physical seal appears administrative or unnecessary
      - requirement_quote: exact quote about the seal requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context

    template: |
      Analyze this regulation for embossed seal/stamp requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether the physical seal requirement is legally mandated or
      could be replaced by digital certification.


original_document:
  updated_at: "2025-12-26"
  display_name: "Original Document Required"
  db_issue_type: "original_document"
  category: "Signatures"
  description: "Original document required (no copies)"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "no photocopies"
    - "original only"
    - "submit.{0,10}original"
    - "provide.{0,10}original"
    - "original document"
    - "original certificate"
    - "original letter"
    - "must be.{0,5}original"
    - "shall be.{0,5}original"
  prompt:
    system: |
      You analyze regulations for ORIGINAL DOCUMENT requirements.

      This section requires an original document. Determine whether there is a clear
      legal rationale for requiring the original (e.g., preventing fraud in negotiable
      instruments, chain of custody for evidence), or whether a photocopy, scanned
      copy, or certified copy would reasonably suffice.

      Flag if the original requirement appears to be administrative rather than
      serving a clear anti-fraud purpose.

      This IS a compliance issue when:
      - Original is required without anti-fraud rationale
      - A photocopy or scanned copy would reasonably suffice
      - The requirement appears to be administrative

      This is NOT a compliance issue when:
      - Document is a negotiable instrument or has chain-of-custody requirements
      - There is clear anti-fraud or authentication purpose
      - The document type inherently requires original (e.g., checks, bonds)

      Respond with:
      - has_issue: true if original requirement appears administrative
      - requirement_quote: exact quote about the original document requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any rationale for original requirement if stated

    template: |
      Analyze this regulation for original document requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether requiring the original serves a clear anti-fraud purpose
      or whether copies would suffice.


# =============================================================================
# PHYSICAL PRESENCE & ACCESS
# =============================================================================

in_person_submission:
  updated_at: "2025-12-26"
  display_name: "In-Person Submission"
  db_issue_type: "in_person_submission"
  category: "Physical Presence"
  description: "Physical presence required for submission"
  response_model: "InPersonAnalysis"
  patterns:
    - "submit.{0,10}in person"
    - "appear in person"
    - "in.{0,3}person.{0,10}submission"
    - "personal appearance"
    - "hand.{0,3}deliver"
  prompt:
    system: |
      You analyze regulations for IN-PERSON SUBMISSION requirements.

      This section requires in-person appearance or submission. Determine whether
      there is a clear rationale for physical presence (e.g., identity verification
      via photo ID, physical inspection, fingerprinting, oath administration).

      If the in-person requirement appears to be for document submission that could
      be handled by mail or electronically, flag it. If there is a legitimate identity
      verification or inspection purpose, note that as context but still flag for
      review of whether remote alternatives exist.

      This IS a compliance issue when:
      - In-person is required for document submission that could be mailed/electronic
