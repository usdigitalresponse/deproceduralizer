physical_inspection:
  updated_at: "2026-03-05"
  display_name: "Physical Inspection Location"
  db_issue_type: "physical_inspection"
  category: "Physical Presence"
  description: "Documents available for inspection at location"
  response_model: "InPersonAnalysis"
  patterns:
    - "available for public inspection"
    - "public inspection"
    - "open to inspection"
    - "maintain for inspection"
    - "available for review at"
    - "during business hours"
  prompt:
    system: |
      You analyze regulations for PHYSICAL INSPECTION requirements.

      This section requires documents to be maintained at a physical location for
      public inspection. Determine whether online access to the same documents is
      also provided.

      If physical inspection is the only option and the documents could reasonably
      be posted online, flag it. Note that some documents may have legitimate reasons
      for in-person-only access (e.g., security-sensitive materials).

      This IS a compliance issue when:
      - Physical inspection is the only access method
      - Documents could reasonably be posted online
      - Online access is not mentioned

      This is NOT a compliance issue when:
      - Online access is also provided
      - Documents contain security-sensitive information
      - Physical inspection is in addition to online access
      - **FOIL/records-access boilerplate**: The text describes a Freedom of Information
        Law (FOIL) process — e.g., "records access officer", "freedom of information",
        "requests for public access to records", "FOIL request", or "records available
        for public inspection pursuant to the Freedom of Information Law". FOIL provisions
        are statutory requirements for government transparency, not burdensome physical-only
        access rules. They typically ensure records ARE available, not that they can ONLY
        be accessed in person. Mark these as has_issue: false.

      Respond with:
      - has_issue: true if physical inspection is the only option
      - requirement_quote: exact quote about the inspection requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any mention of online access or sensitivity concerns

    template: |
      Analyze this regulation for physical inspection requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether online access is also provided or if physical inspection
      is the only option.


physical_posting:
  updated_at: "2025-12-26"
  display_name: "Physical Posting Required"
  db_issue_type: "physical_posting"
  category: "Physical Presence"
  description: "Signs/notices must be physically posted"
  response_model: "InPersonAnalysis"
  patterns:
    - "conspicuously posted"
    - "conspicuously displayed"
    - "prominently displayed"
    - "prominently posted"
    - "posted on the premises"
    - "posted at all times"
    - "post a notice"
    - "display.{0,10}sign"
    - "visible to the public"
  prompt:
    system: |
      You analyze regulations for PHYSICAL POSTING/DISPLAY requirements.

      This section requires physical posting or display of a notice or sign.
      Determine whether this is in addition to online posting or the only requirement.

      For requirements that serve on-site informational purposes (e.g., safety notices,
      licenses at a business location), physical posting may be appropriate and this
      is a lower priority flag.

      For notices that are primarily informational to the general public rather than
      on-site visitors, flag if online posting is not also required.

      This IS a compliance issue when:
      - Physical posting is the only notification method for public notices
      - Online posting is not mentioned for general public information
      - The notice is primarily for off-site audiences

      This is a LOWER PRIORITY issue when:
      - Physical posting serves on-site safety or informational purposes
      - The notice is for customers/visitors at a physical location
      - License display is required at place of business

      Respond with:
      - has_issue: true if physical posting is required without online alternative for public notices
      - requirement_quote: exact quote about the posting requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: whether this is on-site informational or general public notice

    template: |
      Analyze this regulation for physical posting/display requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether this is in addition to online posting or the only requirement,
      and whether it serves on-site or general public purposes.


bulletin_board:
  updated_at: "2025-12-26"
