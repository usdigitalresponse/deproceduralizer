      This section specifies photo requirements. Determine whether the photo
      requirement itself is necessary and whether the specific dimensions are
      standard (e.g., passport-standard 2x2) or unusual.

      Flag if photo submission could reasonably be digital upload rather than
      physical attachment, or if specifications seem arbitrary.

      This IS a compliance issue when:
      - Physical photo attachment is required (no digital upload)
      - Photo specifications are unusual or arbitrary
      - Digital photo submission is not mentioned

      This is NOT a compliance issue when:
      - Digital photo upload is permitted
      - Specifications are standard (passport, ID card sizes)
      - Photo requirement itself serves identity verification purpose

      Respond with:
      - has_issue: true if physical photo required or specs are unusual
      - requirement_quote: exact quote about the photo requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: specific dimensions required and whether digital upload is mentioned

    template: |
      Analyze this regulation for photo specification requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether photo requirements are reasonable and whether digital
      upload is permitted.


letterhead:
  updated_at: "2025-12-26"
  display_name: "Letterhead Required"
  db_issue_type: "letterhead"
  category: "Document Format"
  description: "Official letterhead required"
  response_model: "DocumentFormatAnalysis"
  patterns:
    - "on letterhead"
    - "official letterhead"
    - "company letterhead"
    - "agency letterhead"
  prompt:
    system: |
      You analyze regulations for LETTERHEAD requirements.

      This section requires documents on letterhead. Determine whether this serves
      an authentication purpose that could not be met by electronic submission with
      digital signature or verification, or whether it is a legacy formality.

      Flag if letterhead requirements prevent electronic submission.

      This IS a compliance issue when:
      - Letterhead is required, preventing electronic submission
      - Digital signature or verification is not accepted as alternative
      - The requirement appears to be formality rather than authentication

      This is NOT a compliance issue when:
      - Electronic submission with digital signature is permitted
      - Letterhead is optional or "preferred"
      - The letterhead serves a clear identification purpose

      Respond with:
      - has_issue: true if letterhead prevents electronic submission
      - requirement_quote: exact quote about the letterhead requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: whether electronic alternatives are mentioned

    template: |
      Analyze this regulation for letterhead requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether letterhead is required and whether electronic submission
      with digital signature is permitted as an alternative.


handwriting_specs:
  updated_at: "2025-12-26"
  display_name: "Handwriting Specifications"
  db_issue_type: "handwriting_specs"
  category: "Document Format"
  description: "Specific handwriting requirements"
  response_model: "DocumentFormatAnalysis"
  patterns:
    - "block letters"
    - "print clearly"
    - "print in ink"
    - "hand-printed"
    - "hand printed"
    - "indelib"  # Added: 49 matches - indelible ink/pencil requirements
  prompt:
    system: |
      You analyze regulations for HANDWRITING SPECIFICATION requirements.

      This section specifies handwriting or writing instrument requirements. Flag
      regulations that impose very specific requirements without modern alternatives,
      such as requiring indelible ink, indelible pencil, or specific pen types.

      These requirements are outdated because modern electronic submission, typed
      forms, and computer-printed documents have replaced handwritten submissions.

      This IS a compliance issue when:
      - Indelible ink or indelible pencil is required (outdated technology)
      - Specific writing instruments are mandated (e.g., "ballpoint pen only")
      - Block letters or specific handwriting styles are required without electronic option
      - The regulation assumes paper/pen completion with no electronic alternative

      This is NOT a compliance issue when:
      - Electronic form submission is available as an alternative
      - Requirements are just for legibility on optional paper backup forms
      - The context is for signatures only (not entire form completion)

      Respond with:
      - has_issue: true if specific handwriting/ink requirements exist without electronic alternative
      - requirement_quote: exact quote about the handwriting or ink requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: whether electronic form submission is mentioned as an alternative

    template: |
      Analyze this regulation for handwriting specification requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether the regulation imposes specific handwriting or ink requirements
      (like indelible ink) without offering electronic alternatives.


binding_required:
  updated_at: "2025-12-26"
  display_name: "Binding Required"
  db_issue_type: "binding_required"
  category: "Document Format"
  description: "Document binding required"
  response_model: "DocumentFormatAnalysis"
  patterns:
    - "spiral bound"
    - "three-ring binder"
    - "ring binder"
  prompt:
    system: |
      You analyze regulations for DOCUMENT BINDING requirements.

      This section requires specific document binding. Determine whether physical
      binding is necessary for the use case (e.g., large reference documents for
      in-person proceedings) or whether electronic submission would eliminate the
      need.

      Flag if binding requirements appear to be legacy formatting rules.

      This IS a compliance issue when:
      - Specific binding is required
      - Electronic submission would eliminate the need
      - The binding requirement appears to be legacy formatting

      This is NOT a compliance issue when:
      - Electronic submission is also available
      - Binding is for physical documents that must be physical
      - Binding serves a clear purpose (large reference documents)

      Respond with:
      - has_issue: true if binding required without electronic alternative
      - requirement_quote: exact quote about the binding requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: specific binding type required and any stated purpose

    template: |
      Analyze this regulation for document binding requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether binding is required and whether electronic submission
      is available as an alternative.


