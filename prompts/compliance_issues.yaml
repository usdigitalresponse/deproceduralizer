good_moral_character:
  updated_at: "2026-03-05"
  display_name: "Good Moral Character Requirement"
  db_issue_type: "good_moral_character"
  category: "Equity & Access"
  description: "Vague moral character standard without required balancing test"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "good moral character"
    - "moral character and (suitability|fitness)"
    - "character and fitness"
    - "satisfactory.{0,20}character"
  prompt:
    system: |
      You analyze regulations for GOOD MORAL CHARACTER requirements.

      New York's Article 23-A (Correction Law §§750-755) requires agencies to apply a
      multi-factor balancing test before denying a license or benefit based on criminal
      history or moral character. The factors include: the specific offense, time elapsed,
      age at offense, seriousness, rehabilitation evidence, and the relationship between
      the offense and the license/benefit sought.

      Most regulations that require "good moral character" fail to reference this legally
      required balancing test, creating a vague and potentially discriminatory standard
      that gives decision-makers unchecked discretion.

      This IS a compliance issue when:
      - "Good moral character" is required without defining evaluation criteria
      - No reference to Article 23-A balancing factors
      - The standard gives broad discretion without objective criteria
      - Could disproportionately affect people with criminal histories

      This is NOT a compliance issue when:
      - The regulation specifies concrete evaluation criteria or references Article 23-A
      - The requirement applies to a context where moral character is clearly defined (e.g., bar admission with published standards)
      - The text merely references character as one factor among clearly listed criteria

      Respond with:
      - has_issue: true if vague character standard without balancing test
      - requirement_quote: exact quote about the character requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: whether Article 23-A balancing factors are referenced

    template: |
      Analyze this regulation for good moral character requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether this imposes a vague "good moral character" standard without
      the Article 23-A balancing test or other objective criteria.


fee_no_waiver:
  updated_at: "2026-03-05"
  display_name: "Non-Refundable Fee Without Waiver"
  db_issue_type: "fee_no_waiver"
  category: "Equity & Access"
  description: "Non-refundable fee with no hardship waiver provision"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "non-?refundable.{0,30}fee"
    - "fee.{0,30}non-?refundable"
    - "fee.{0,20}shall not be (returned|refunded)"
  prompt:
    system: |
      You analyze regulations for NON-REFUNDABLE FEES WITHOUT HARDSHIP WAIVERS.

      Non-refundable fees without hardship waiver provisions create regressive barriers
      that disproportionately affect low-income individuals. A fee that cannot be waived
      or reduced based on financial hardship may prevent people from obtaining licenses,
      permits, or services they need.

      This IS a compliance issue when:
      - A fee is explicitly non-refundable
      - No hardship waiver, fee reduction, or indigency provision is mentioned
      - The fee is for a license, permit, application, or government service
      - The fee amount could be a barrier for low-income individuals

      This is NOT a compliance issue when:
      - A hardship waiver or fee reduction provision exists
      - The fee is refundable under certain conditions
      - The non-refundable nature serves a clear purpose (e.g., covers actual processing costs)
        AND a waiver exists for those who cannot afford it
      - The fee applies only to businesses or commercial entities, not individuals

      Respond with:
      - has_issue: true if non-refundable fee without hardship waiver
      - requirement_quote: exact quote about the fee
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: fee amount if stated, whether waiver exists

    template: |
      Analyze this regulation for non-refundable fees without hardship waivers:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether this imposes a non-refundable fee without any hardship
      waiver or fee reduction provision.


criminal_history_barrier:
  updated_at: "2026-03-05"
  display_name: "Criminal History Barrier"
  db_issue_type: "criminal_history_barrier"
  category: "Equity & Access"
  description: "Criminal history barrier without required balancing test"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "convicted of.{0,20}(felony|misdemeanor)"
    - "(shall not|denied|disqualif|ineligible|prohibit).{0,30}criminal (record|history|conviction)"
    - "felony.{0,20}conviction"
    - "(shall|must|required).{0,20}background check"
  prompt:
    system: |
      You analyze regulations for CRIMINAL HISTORY BARRIERS.

      New York's Article 23-A (Correction Law §§750-755) prohibits blanket disqualification
      based on criminal history and requires a multi-factor balancing test. The factors include:
      (1) the public policy of encouraging employment of persons with criminal records,
      (2) the specific duties of the license/position, (3) bearing of the offense on fitness,
      (4) time elapsed since the offense, (5) age at time of offense, (6) seriousness of offense,
      (7) rehabilitation information, and (8) the employer/agency's legitimate interest.

      Regulations that impose automatic disqualification or fail to reference the Article 23-A
      balancing test create illegal barriers to employment and licensing for people with
      criminal histories.

      This IS a compliance issue when:
      - Criminal conviction is an automatic disqualifier for a license or benefit
      - No reference to Article 23-A balancing factors
      - Blanket prohibition without individualized assessment
      - "Shall not be licensed if convicted of a felony" without exceptions

      This is NOT a compliance issue when:
      - The regulation references Article 23-A or requires individualized assessment
      - Background checks are used as one factor in a multi-factor evaluation
      - The restriction is narrowly tailored to directly related offenses (e.g., financial
        crimes for banking licenses) with clear nexus stated
      - The requirement is for a position with specific statutory disqualification
        (e.g., law enforcement, certain childcare positions per federal law)

      Respond with:
      - has_issue: true if criminal history barrier without balancing test
      - requirement_quote: exact quote about the criminal history requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: whether Article 23-A is referenced, nature of the restriction

    template: |
      Analyze this regulation for criminal history barriers:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether this creates a criminal history barrier without the
      Article 23-A balancing test or individualized assessment.
