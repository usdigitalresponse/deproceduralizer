# Issue Configs Index
# V4-compatible issue configuration files for research_pipeline.yaml
#
# Each file contains:
#   - description: Maps to {issue_description} in tier prompts
#   - positive_indicators: Maps to {positive_indicators}
#   - negative_indicators: Maps to {negative_indicators}
#   - severity_baseline/modifiers: Maps to {severity_baseline}/{severity_modifiers}
#   - patterns: Regex patterns for candidate detection
#   - statistics: Database statistics (TPR, match counts)
#   - examples: True/false positive examples for few-shot learning
#
# Usage:
#   Load these configs to populate tier prompt template variables.
#   Each issue_type key matches db_issue_type in compliance_issues table.

# Communication & Submission Methods
communication:
  - mail_only
  - certified_mail
  - fax
  - obsolete_comm
  - landline

# Payment
payment:
  - check_payment
  - cash_only
  - no_credit_cards
  - in_person_payment

# Signatures & Authentication
signatures:
  - wet_signature
  - notarization
  - witness
  - embossed_seal
  - original_document

# Physical Presence
physical_presence:
  - in_person_submission
  - in_person_hearing
  - in_person_pickup
  - physical_forms
  - physical_inspection
  - physical_posting
  - bulletin_board

# Technology & Media
technology:
  - obsolete_media
  - microfiche
  - obsolete_software
  - typewriter
  - pdf_only
  - carbon_copy
  - newspaper

# Document Format
document_format:
  - multiple_copies
  - paper_specs
  - photo_specs
  - letterhead
  - handwriting_specs
  - binding_required

# Process & Tracking
process:
  - physical_log
  - routing_slip
  - storage_location
  - fixed_window
  - waiting_period
  - mandated_reports
  - reporting_frequency

