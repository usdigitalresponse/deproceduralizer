witness:
  updated_at: '2026-01-03'
  display_name: Witness Required
  db_issue_type: witness
  category: Signatures
  description: 'One or more witnesses are required for document signing, requiring coordination with additional
    people. This burdens: citizens executing legal documents, home purchases, or matters for children
    who must find available witnesses; businesses with routine document needs; professionals certifying
    multi-party transactions; and particularly vulnerable populations including elderly who may lack available
    witnesses, those in rural areas with few nearby contacts, homebound individuals, and socially isolated
    people for whom finding witnesses creates significant barriers. Electronic verification or notarization
    could often replace witness requirements.'
  positive_indicators:
  - '"shall be witnessed" or "must be witnessed" - high precision pattern (90% TPR)'
  - '"witness required" or "require witness" explicit requirement'
  - Administrative witness requirements (not for wills/guardianship)
  - Number of witnesses seems excessive for document type
  - No statutory mandate for witness requirement
  negative_indicators:
  - '"attested to" or "attested by" is CERTIFICATION language, not witness requirement'
  - '"self-attest" or "attestation that [person]" is self-declaration'
  - Witness requirements for wills, guardianship, or medical decisions (legally necessary)
  - '"or notary" appears (alternative offered)'
  - Corporate secretary attesting president signature (standard corporate formality)
  - Document type traditionally requires witnesses (wills, certain contracts)
  severity_baseline: 4
  severity_modifiers:
    increases:
    - '+1: Multiple witnesses required (2+)'
    - '+1: No notarization alternative offered'
    - '+1: Administrative rather than legal necessity'
    decreases:
    - '-2: Statutory requirement for this document type'
    - '-1: Document type traditionally requires witnesses (wills, contracts)'
    - '-1: Clear anti-fraud purpose stated'
  patterns:
  - (shall|must).{0,15}(be )?witnessed
  - witness.{0,10}(is |shall be |are )?required
  - require.{0,15}witness
  - two witnesses
  - witness.{0,5}signature
  patterns_to_remove:
  - \battested\b
  - attestation
  exclusion_patterns:
  - attested to (certification language)
  - attested by (certification language)
  - self-attest (self-declaration)
  - or notary (alternative offered)
  statistics:
    total_matches: 338
    true_positives: 103
    true_positive_rate: 30.47
    sample_date: '2026-01-01'
  examples:
    true_positives:
    - citation: 9 NYCRR 7002.4
      quote: inventory shall be witnessed and signed by a second facility staff member
      reasoning: Administrative witness requirement for inventory. Could be electronic.
      classification: burdensome
      severity: 4
    - citation: N.J.A.C. 7:9A-10.7
      quote: test shall be witnessed by the administrative authority
      reasoning: Witness requirement for testing procedure. Administrative burden.
      classification: burdensome
      severity: 4
    - citation: N.J.A.C. 8:37-3.1
      quote: authorization must be in writing, and must be witnessed in writing
      reasoning: Double witness requirement adds unnecessary burden.
      classification: burdensome
      severity: 5
    - citation: 9 NYCRR 1627-4.1
      quote: signing of the lease...shall be witnessed by a designated authority employee
      reasoning: Lease witnessing by specific employee type. Administrative burden.
      classification: burdensome
      severity: 4
    - citation: 8 NYCRR 247.3
      quote: request shall be witnessed by two agency employees
      reasoning: Requires TWO witnesses from agency. Excessive for routine request.
      classification: burdensome
      severity: 5
    false_positives:
    - citation: 8 NYCRR 90.9
      quote: population figure attested to in writing by a government official
      reasoning: '''Attested to'' means verified/certified, not witnessed. Certification language.'
      classification: unrelated
    - citation: 8 NYCRR 59.16
      quote: servicemember attestation requirements
      reasoning: Self-attestation by the servicemember, not a witness requirement.
      classification: unrelated
    - citation: N.J.A.C. 11:2-28.2
      quote: Secretary attests president's signature
      reasoning: Standard corporate formality, not burdensome witness requirement.
      classification: unrelated
    justified:
    - citation: N.J.A.C. 3:6-8.3
      quote: The will shall be witnessed by two persons
      reasoning: Will witnessing is legally required by statute. Necessary for validity.
      classification: justified
      severity: 2
