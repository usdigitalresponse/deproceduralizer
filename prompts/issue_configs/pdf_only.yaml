pdf_only:
  updated_at: '2026-04-05'
  display_name: PDF Only Format
  db_issue_type: pdf_only
  category: Technology
  description: 'PDF format is required exclusively — either for submission or as the only format provided
    by government — creating barriers when alternatives would improve accessibility. This affects BOTH
    directions: (1) Public-to-government: citizens must convert documents to PDF, requiring software and
    technical skills many lack. (2) Government-to-public: agency forms available only as PDF downloads
    with no online fillable alternative force citizens to print, fill by hand, scan, and return — or
    purchase PDF editing software. Vulnerable populations are particularly affected: elderly unfamiliar
    with format conversion, disabled individuals using screen readers that work better with HTML forms,
    low-income people without Adobe software, and those with limited technical skills.'
  positive_indicators:
  - PDF is the ONLY accepted format
  - Other common formats explicitly rejected
  - Online form entry is not available
  - '"must be PDF" or "PDF only" explicit exclusion'
  - No alternative submission method
  - Government-provided forms available only as PDF download with no online fillable alternative
  negative_indicators:
  - PDF is one of several accepted formats
  - Online form submission available
  - Requirement is for final/archival documents where PDF is standard
  - '"PDF preferred" not required'
  - Agency provides PDF alongside web forms or other accessible formats (PDF as one of multiple options is fine)
  severity_baseline: 2
  severity_modifiers:
    increases:
    - '+1: Other formats explicitly rejected'
    - '+1: No online form alternative'
    - '+1: Accessibility impact'
    decreases:
    - '-1: PDF is industry standard for document type'
    - '-1: Multiple formats accepted'
    - '-1: Final/archival purpose'
  patterns:
  - pdf format
  - submit as pdf
  - adobe pdf
  - \.pdf\b
  statistics:
    total_matches: 201
    true_positives: 3
    true_positive_rate: 1.49
    sample_date: '2026-01-01'
  precision_notes: 'PDF_only has only 1.49% TPR because:

    1. Most ".pdf" mentions are just file references

    2. "PDF format" often describes output alongside other options

    3. PDF is so common it''s rarely an actual burden when alternatives exist

    4. PDF-only output IS burdensome when no web form or fillable alternative is offered

    '
  examples:
    true_positives:
    - citation: N.J.A.C. 7:26-8.6
      quote: applications must be submitted in PDF format only
      reasoning: '''Only'' indicates exclusive requirement. No alternatives.'
      classification: burdensome
      severity: 3
    false_positives:
    - citation: N.J.A.C. 17:12-2.5
      quote: forms available for download in PDF format
      reasoning: If PDF is the ONLY format available with no online fillable web form alternative, this
        is burdensome — citizens must download, print, fill by hand, and mail back. If the agency also
        provides a web form or fillable PDF, it would be unrelated. Classify based on whether alternatives
        exist in context.
      classification: burdensome
      severity: 3
    - citation: N.J.A.C. 13:45A-5.2
      quote: submit via portal or as PDF attachment
      reasoning: Online portal is alternative.
      classification: unrelated
    - citation: N.J.A.C. 8:43-2.3
      quote: PDF, Word, or plain text format accepted
      reasoning: Multiple formats accepted.
      classification: unrelated
    justified:
    - citation: N.J.A.C. 14:3-7.4
      quote: final engineering drawings in PDF/A format
      reasoning: Archival format for permanent records. Standard practice.
      classification: justified
      severity: 1
