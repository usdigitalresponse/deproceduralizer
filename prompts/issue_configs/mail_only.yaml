mail_only:
  updated_at: '2026-04-05'
  display_name: Mail-Only Communication
  db_issue_type: mail_only
  category: Communication
  description: 'Mail is prescribed as the required communication method — either for public submissions
    TO government or government communications TO the public — with no electronic alternative. This
    covers both directions: (1) Inbound: citizens, businesses, or professionals must submit documents
    by mail, adding delays and costs. (2) Outbound: government agencies are mandated to send notices,
    decisions, or documents by physical mail rather than faster/cheaper electronic methods. Both
    directions are modernization opportunities. Outbound mail mandates burden the agency (printing,
    postage, staffing) AND the recipient — people who move, are transient, homeless, hospitalized,
    or traveling may miss critical notices like hearing dates, benefit determinations, or license
    renewals. Keeping a mailing address current is difficult for many populations, and mail-only
    communication means time-sensitive information arrives days late when email, text, or portal
    notifications would be instant and more reliably received.'
  positive_indicators:
  - '"shall submit by mail" or "must be mailed" with no alternatives mentioned'
  - Only USPS/postal service mentioned for submission (no email, portal, electronic)
  - '"mail only" or "submit by mail only" explicit restrictions'
  - Submission address is a physical mailing address without online alternative
  - Pattern "(applicant|petitioner|person) shall mail" indicates inbound requirement
  - No mention of email, online portal, or electronic submission options in surrounding context
  - 'Agency/board/department "shall mail" or "shall be mailed" TO parties — outbound mail mandate with
    no electronic alternative'
  - 'Notices, decisions, or determinations that "shall be sent by" certified/registered mail — mandated
    government outbound communication method'
  - 'Hearing notices, orders, or official documents that must be served "by mail" — government-to-public
    communication locked to postal service'
  negative_indicators:
  - Electronic alternative explicitly mentioned ("or electronically", "or via portal", "or email")
  - '"may submit by mail OR" with alternatives listed'
  - '"or" appears within 30 characters of mail reference (indicates alternatives)'
  - Mail is mentioned for contact info or general context, not a communication requirement
  - Reference to electronic filing system, online submission, or digital alternative
  - Mail is one of multiple delivery options explicitly listed (e.g., "by mail, fax, or electronic means")
  - Permissive language about mail ("may be sent by mail") rather than mandatory ("shall be mailed")
  severity_baseline: 4
  severity_modifiers:
    increases:
    - '+1: No alternative communication method mentioned anywhere in document'
    - '+1: Time-sensitive deadline where mail delays are problematic'
    - '+1: Requires certified/registered mail (additional cost burden)'
    - '+1: Affects vulnerable populations or high-volume processes'
    - '+1: High-volume outbound notices (e.g., thousands of hearing notices per year)'
    decreases:
    - '-1: Statutory requirement (from_statute=true) mandates mail'
    - '-1: Physical document authenticity genuinely needed (original signatures, chain of custody)'
    - '-2: Security or legal constraints legitimately require physical delivery'
    - '-1: Outbound mail is a backup/confirmation for electronic delivery already provided'
  patterns:
  - must be mailed
  - shall be mailed
  - send by mail
  - submit.{0,20}by mail
  - mail.{0,10}only
  - first.{0,10}class.{0,10}mail
  - postmarked by
  - (applicant|petitioner|person).{0,20}(must|shall).{0,15}mail
  - only.{0,10}by mail
  exclusion_patterns:
  - '''or'' within 30 chars of ''mail'' (indicates alternatives)'
  - electronic|email|online|portal within 80 chars (alternative exists)
  statistics:
    total_matches: 347
    true_positives: 124
    true_positive_rate: 35.73
    sample_date: '2026-01-01'
  examples:
    true_positives:
    - citation: 9 NYCRR 10000.2
      quote: must be mailed...via a mail carrier service that provides proof of date of mailing
      reasoning: Requires mailing with proof of date, no electronic option visible. This is a true mail-only
        requirement.
      classification: burdensome
      severity: 5
    - citation: N.J.A.C. 13:45A-9.2
      quote: Applications shall be submitted by mail to the Division office at 123 Main Street.
      reasoning: Mandatory mail submission with no electronic alternative mentioned. Uses 'shall' indicating
        requirement.
      classification: burdensome
      severity: 5
    - citation: N.J.A.C. 13:45A-26F.12
      quote: Notice...shall be mailed by OAL to both parties
      reasoning: Government is mandated to mail notices to parties with no electronic alternative mentioned.
        This is an outbound mail mandate — the agency must use physical mail for official communications,
        adding cost and delay when email or portal notification would suffice.
      classification: burdensome
      severity: 4
    - citation: 12 NYCRR 328.6
      quote: Notice of such hearing shall be mailed by registered or certified mail
      reasoning: Agency is mandated to send hearing notices by registered/certified mail — expensive outbound
        communication requirement with no electronic alternative. Recipients receive slower notification
        than email or text would provide.
      classification: burdensome
      severity: 5
    false_positives:
    - citation: 20 NYCRR 473.1
      quote: mailed or delivered/submitted
      reasoning: Explicitly offers alternatives to mail ('or delivered/submitted'). Mail is optional,
        not required.
      classification: unrelated
    - citation: 13 NYCRR 22.5
      quote: mailed or submitted
      reasoning: The word 'or' indicates alternatives exist. Electronic submission is implied.
      classification: unrelated
    - citation: 9 NYCRR 54.3
      quote: notices shall be served by mail or electronic means
      reasoning: Both mail and electronic delivery are permitted — mail is not the only option.
      classification: unrelated
    justified:
    - citation: N.J.A.C. 13:69D-1.5
      quote: Original documents must be mailed for authentication as required by N.J.S.A. 52:7-1
      reasoning: Mail requirement is mandated by state statute for authentication purposes. Physical originals
        genuinely needed.
      classification: justified
      severity: 3
