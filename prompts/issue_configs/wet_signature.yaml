wet_signature:
  updated_at: '2026-04-05'
  display_name: Wet Signature
  db_issue_type: wet_signature
  category: Signatures
  description: 'A physical wet/ink signature is required on documents, prohibiting true electronic
    signatures and requiring physical document handling. NOTE: "Scanned signatures" (print, sign in
    ink, scan, upload) are NOT true electronic signatures — they still require physical signing and
    should be treated as wet signature requirements. True electronic signatures are typed names,
    DocuSign-style click-to-sign, PKI digital signatures, or other methods that never require pen
    on paper. This burdens: citizens who must print, sign, and mail documents for permits, home
    purchases, or childcare paperwork; businesses with remote employees who cannot easily sign physical
    documents; professionals signing certifications and filings; government staff managing paper instead
    of electronic workflows; and particularly vulnerable populations including elderly with mobility
    issues or hand tremors, rural residents far from delivery services, and disabled individuals who
    struggle with physical document handling.

    IMPORTANT: Notarized signatures inherently require wet signatures (you must physically sign before
    the notary). If a regulation requires notarization, the wet signature component IS a burden even
    though notarization is also its own issue type. Flag as potentially burdensome at lower severity
    rather than dismissing as unrelated — analyze the full requirement in context.'
  positive_indicators:
  - '"wet signature" - explicit requirement for physical ink signature'
  - '"original signature" - indicates physical signature on original document'
  - '"ink signature" or "signed in ink" - specifies physical signing'
  - '"handwritten signature" - explicitly requires hand-signing'
  - '"manually signed" or "physical signature" - requires physical action'
  - Explicit prohibition of electronic/digital/fax signatures
  - '"signature in blue/black ink" - color specification implies physical'
  - '"scanned signature" or "image of signature" — still requires physical signing, NOT a true e-signature'
  - 'Notarization requirement — inherently requires physical signing before a notary. Flag the wet
    signature component at lower severity (2-3) since notarization issue type captures the notary burden'
  negative_indicators:
  - Generic "shall be signed" or "must be signed" (allows electronic under UETA/E-SIGN)
  - '"signature required" without wet/ink/handwritten modifier'
  - '"bear the signature of" - generic signature requirement'
  - True electronic signature explicitly permitted (DocuSign, typed name, PKI digital signature, click-to-sign)
  - Context of fully electronic systems or digital-native workflows where signing is electronic by design
  - '"signed" appearing in electronic submission context'
  severity_baseline: 5
  severity_modifiers:
    increases:
    - '+1: No electronic signature alternative mentioned'
    - '+1: High-volume or routine documents'
    - '+2: Explicit prohibition of electronic signatures'
    - '+1: Scanned/imaged signature treated as "electronic" when it still requires physical signing'
    decreases:
    - '-1: Statutory requirement mandates physical signature'
    - '-1: Document type where physical signature genuinely needed (checks, deeds)'
    - '-2: True electronic signature explicitly permitted (not just scanned image)'
    - '-2: Notarization-driven wet signature (notarization issue type captures primary burden)'
  patterns:
  - wet signature
  - ink signature
  - handwritten signature
  - original signature
  - signed in ink
  - blue ink
  - black ink
  - manually signed
  - physical signature
  - personally sign
  - notarized.{0,20}signature
  - signature.{0,20}notari
  - bear.{0,10}signature
  exclusion_patterns:
  - shall be signed (generic, allows electronic)
  - must be signed (generic, allows electronic)
  - signature required (generic)
  - signature.{0,10}of (generic)
  - signed.{0,10}by (generic)
  statistics:
    total_matches: 168
    true_positives: 103
    true_positive_rate: 61.31
    sample_date: '2026-01-01'
  legal_context: 'Under UETA and the E-SIGN Act, generic signature requirements ("shall be signed")
    are satisfied by electronic signatures. ONLY explicit requirements for "wet",
    "ink", "handwritten", "original", or "physical" signatures, OR explicit prohibitions
    of electronic signatures, constitute wet signature requirements.

    IMPORTANT: "Scanned signatures" and "imaged signatures" are NOT true electronic
    signatures under UETA/E-SIGN. They still require pen-on-paper followed by digitization.
    Treat them as wet signature requirements.

    Notarized signatures inherently require physical signing before the notary. Even if
    the notarization issue type captures the notary burden, the underlying wet signature
    component should still be flagged (at lower severity) rather than dismissed.'
  examples:
    true_positives:
    - citation: N.J.A.C. 17:12-2.5
      quote: shall bear the original signature of the authorized person
      reasoning: '''Original signature'' explicitly requires physical, not electronic.'
      classification: burdensome
      severity: 5
    - citation: N.J.A.C. 10:45-3.2
      quote: The form must be signed in ink
      reasoning: Explicit 'signed in ink' requirement prohibits electronic.
      classification: burdensome
      severity: 5
    - citation: N.J.A.C. 8:42-3.1
      quote: wet signature required; electronic signatures not accepted
      reasoning: Explicit wet signature requirement with electronic prohibition.
      classification: burdensome
      severity: 6
    - citation: 6 NYCRR 622.3
      quote: signed using scanned electronic signatures
      reasoning: '"Scanned electronic signature" still requires physical signing — print, sign in
        ink, scan. This is NOT a true electronic signature. The physical signing step is the burden,
        and digitizing it afterward does not eliminate that burden.'
      classification: burdensome
      severity: 4
    - citation: 18 NYCRR 421.6
      quote: form shall be notarized
      reasoning: Notarization inherently requires physical signing before the notary. While the
        notarization issue type captures the notary access burden, the wet signature component is
        still a burden — the signer must physically appear and sign on paper. Flag at lower severity
        since notarization is the primary burden.
      classification: burdensome
      severity: 3
    false_positives:
    - citation: N.J.A.C. 13:45A-5.1
      quote: The application shall be signed by the applicant
      reasoning: Generic 'shall be signed' allows electronic under UETA/E-SIGN.
      classification: unrelated
    - citation: N.J.A.C. 7:26-8.2
      quote: must bear the signature of the responsible official
      reasoning: Generic signature requirement without wet/ink specification.
      classification: unrelated
    justified:
    - citation: N.J.A.C. 3:6-8.5
      quote: checks must bear original signature of account holder
      reasoning: Financial instruments genuinely require wet signature for security.
      classification: justified
      severity: 3
