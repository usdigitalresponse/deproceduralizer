# =============================================================================
# Research Pipeline Prompts (V5 Proactive Context + Argument Framing)
# =============================================================================
#
# V5 3-Tier Architecture:
#   - Pre-Tier 1: Deterministic context gathering (no LLM, keyword filtering)
#   - Tier 1: Match Filtering + Argument Framing (triage + prime Tier 2)
#   - Tier 2: Full Classification (full doc + definitions + can re-run for context)
#   - Tier 3: Web Search Validation (external sources, selective triggers)
#
# =============================================================================
# CACHE-OPTIMIZED 4-LAYER STRUCTURE
# =============================================================================
#
# Each tier has 4 prompt layers ordered by cache lifetime:
#
#   1. static_core:      Same for ALL requests across ALL issue types (~60% of tokens)
#                        → Cached globally, massive token savings
#
#   2. issue_block:      Same for all documents of the SAME issue type (~15% of tokens)
#                        → Cached per issue type (40+ types)
#
#   3. batch_context:    Same for all documents in the SAME subchapter (~15% of tokens)
#                        → Cached per subchapter (siblings share ancestors, catalogs, definitions)
#
#   4. document_template: Unique per document (~10% of tokens)
#                        → Never cached
#
# Assembly order in Python:
#   system = static_core
#   user = issue_block + batch_context + document_template
#
# Cache breakpoints:
#   [static_core]              ← cache_control: ephemeral (system message, global cache)
#   [issue_block+batch_context] ← cache_control: ephemeral (user message prefix)
#   [document_template]         ← no cache_control (unique per document)
#
# Issue Configs (./issue_configs/*.yaml):
#   - {issue_type}: From config.db_issue_type
#   - {issue_description}: From config.description
#   - {positive_indicators}: From config.positive_indicators
#   - {negative_indicators}: From config.negative_indicators
#   - {severity_baseline}: From config.severity_baseline
#   - {severity_modifiers}: From config.severity_modifiers
#   - {issue_examples}: From config.examples
#
# =============================================================================

# =============================================================================
# TIER 1: MATCH FILTERING + ARGUMENT FRAMING (V5)
# =============================================================================

tier1:
  updated_at: "2026-01-05"
  description: "Filter regex matches, generate argument framing, recommend context"

  # ─────────────────────────────────────────────────────────────────────────
  # LAYER 1: Static Core (cached globally - same for ALL issue types)
  # ─────────────────────────────────────────────────────────────────────────
  static_core: |
    # Tier 1: Match Filtering + Argument Framing

    You are analyzing regex matches for potential regulatory burden issues.
    Your goals are:
    1. Identify which matches are genuinely relevant to the issue type
    2. Dismiss false positives with clear reasoning
    3. If any matches are valid: generate argument framing to prime Tier 2 analysis
    4. Recommend specific context items for Tier 2 to request

    ## Your Task

    For each regex match provided:
    1. Read the surrounding context (~300 chars)
    2. Determine if this genuinely indicates the issue type
    3. If false positive, explain why briefly

    After reviewing all matches:
    - If ALL are false positives, classify as "all_false_positives" and SKIP argument framing
    - If ANY are potentially valid, classify as "needs_research" and PROVIDE argument framing

    ## Argument Framing (ONLY if classification = "needs_research")

    Generate three arguments to prime Tier 2's thinking:

    **best_argument_burdensome**: The strongest case for why this is a genuine burden
    - Focus on impact, lack of alternatives, outdated requirements
    - Consider ALL affected parties and how severely each is impacted:
      * Citizens (applying for permits, buying homes, caring for children)
      * Businesses (compliance filings, permits, recordkeeping)
      * Government staff (processing paperwork, maintaining systems)
      * Professionals (maintaining licenses, serving clients)
      * Vulnerable populations (elderly, disabled, low-income, rural, youth/children)

    **best_argument_justified**: The strongest case for why this burden is necessary
    - Consider safety, security, fraud prevention, statutory mandate
    - Look for legitimate regulatory purpose

    **best_argument_unrelated**: The strongest case for why this isn't actually the issue type
    - Consider definitional issues, scope limitations, false positive indicators
    - Look for reasons the match might be misleading

    These arguments help Tier 2 consider all perspectives before making a final classification.

    ## Context Requests

    Review the proactive summaries provided and the full catalogs.
    Request specific context items for Tier 2 to fetch. Each request specifies:

    - **context_type**: "sibling", "cross_reference", "definition", or "hierarchy"
    - **identifier**: Citation (for documents) or term (for definitions)
    - **need_level**: "summary" (default) or "full_text" (when exact language matters)
    - **reason**: Why this context would help the analysis

    Use `full_text` when you need exact regulatory language (exemptions, waivers, scope).
    Use `summary` when you just need to understand the general purpose or topic.

    Only request items that would genuinely help determine the classification.

    ## FIELD VALUE CONSTRAINTS (STRICT)

    | Field | Allowed Values |
    |-------|----------------|
    | classification | "all_false_positives", "needs_research" (exactly one, lowercase) |
    | confidence | 0.0 to 1.0 (decimal, e.g., 0.85) |
    | need_level | "summary", "full_text" |
    | context_type | "sibling", "cross_reference", "definition", "hierarchy" |

    ## Response Structure

    For "all_false_positives" (skip argument framing and context requests):
    ```json
    {
      "relevant_match_indices": [],
      "dismissed_matches": [
        {"match_index": 1, "text": "matched text", "reason": "why this is a false positive"}
      ],
      "classification": "all_false_positives",
      "confidence": 0.92,
      "reasoning": "Brief explanation of why all matches are false positives",
      "context_requests": []
    }
    ```

    For "needs_research" (include argument framing and context requests):
    ```json
    {
      "relevant_match_indices": [1, 2, 5],
      "dismissed_matches": [
        {"match_index": 3, "text": "matched text", "reason": "why this is a false positive"}
      ],
      "classification": "needs_research",
      "confidence": 0.85,
      "reasoning": "Brief explanation of your overall assessment",

      "best_argument_burdensome": "This appears to require in-person appearance with no electronic alternative mentioned.",
      "best_argument_justified": "The in-person requirement may serve identity verification purposes for high-stakes licensing.",
      "best_argument_unrelated": "The phrase 'appear before' might refer to documentary appearance rather than physical presence.",

      "context_requests": [
        {
          "context_type": "sibling",
          "identifier": "N.J.A.C. 13:69D-1.35",
          "need_level": "full_text",
          "reason": "May contain waiver provisions for the appearance requirement"
        },
        {
          "context_type": "cross_reference",
          "identifier": "N.J.A.C. 13:69B-1.1",
          "need_level": "summary",
          "reason": "Referenced as governing procedure - need to understand scope"
        },
        {
          "context_type": "definition",
          "identifier": "applicant",
          "need_level": "summary",
          "reason": "Need to confirm who is affected by this requirement"
        }
      ]
    }
    ```

  # ─────────────────────────────────────────────────────────────────────────
  # LAYER 2: Issue Block (cached per issue type)
  # ─────────────────────────────────────────────────────────────────────────
  issue_block: |
    ---
    ## Issue Type Configuration

    **Issue Type**: {issue_type}

    **Description**: {issue_description}

    **Positive Indicators** (likely a real issue):
    {positive_indicators}

    **Negative Indicators** (likely a false positive):
    {negative_indicators}

    **Issue-Specific Examples**:
    {issue_examples}

  # ─────────────────────────────────────────────────────────────────────────
  # LAYER 3: Batch Context (cached per subchapter - shared by siblings)
  # ─────────────────────────────────────────────────────────────────────────
  batch_context: |
    ---
    ## Shared Context (Subchapter: {subchapter_citation})

    ### Ancestor Summaries
    {ancestor_summaries}

    ### All Siblings ({sibling_count} total){sibling_catalog_truncated}
    {sibling_catalog}

    ### Keyword-Matched Sibling Summaries
    {keyword_sibling_summaries}

    ### All Definition Terms Available
    {definition_terms}

  # ─────────────────────────────────────────────────────────────────────────
  # LAYER 4: Document Template (never cached - unique per document)
  # ─────────────────────────────────────────────────────────────────────────
  document_template: |
    ---
    ## Document Under Analysis
    Citation: {citation}
    Title: {title}

    ## Document Summary
    {document_summary}

    ## Matches to Evaluate ({match_count} total)
    {match_list}

    ### Preceding and Following Siblings
    {immediate_siblings}

    ### All Cross-References ({crossref_count} total){crossref_catalog_truncated}
    {crossref_catalog}

    ### Keyword-Matched Cross-Reference Summaries
    {keyword_crossref_summaries}

    ---

    Analyze the matches above. Return your assessment as JSON.
    Remember:
    - If ALL matches are false positives → skip argument framing, return empty context_requests
    - If ANY match is valid → provide argument framing AND context_requests for items that would help Tier 2


# =============================================================================
# TIER 2: FULL CLASSIFICATION (V5)
# =============================================================================

tier2:
  updated_at: "2026-03-10"
  description: "Full document classification with re-run capability"

  # ─────────────────────────────────────────────────────────────────────────
  # LAYER 1: Static Core (cached globally - same for ALL issue types)
  # ─────────────────────────────────────────────────────────────────────────
  static_core: |
    # Tier 2: Full Classification

    You are conducting in-depth research on a regulatory document to determine
    if it contains a genuine compliance burden issue.

    ## 12-Step Analysis Process

    Follow this procedure carefully:

    1. **Read the full section content** - Understand the complete regulation
    2. **Check inherited definitions** - Terms may have specific legal meanings
    3. **Review Tier 1's argument framing** - Consider all three perspectives
    4. **Review fetched context** - Tier 1 requested specific context items (siblings, cross-refs, definitions) that are provided below
    5. **Identify the specific requirement language** - Exact burden text
    6. **Determine if mandatory or optional** - "shall" vs "may"
    7. **Check for electronic/alternative options** - Modern alternatives?
    8. **Look for statute citations** - Statutory mandate?
    9. **Consider legitimate purpose** - Safety, security, fraud prevention? 
    10. **Assess impact on ALL affected parties** - Consider each group:
        - Citizens (applying for permits, buying homes, caring for children)
        - Businesses (compliance filings, permits, recordkeeping, hiring)
        - Government staff (processing paperwork, maintaining systems)
        - Professionals (maintaining licenses, serving clients)
        - Vulnerable populations (elderly, disabled, low-income, rural, youth/children)
        - For each group, What is the risk this is mitigating?  The reward of implementation? How does that weigh against the inevitable burden and cost of implementation and/or compliance?
        - Set **primary_affected_population** to the single group MOST impacted
    11. **Calculate severity** - Baseline + modifiers
    12. **Extract verbatim requirement text** - Exact quotes

    ## Classification Criteria

    **UNRELATED**: The matched text does not actually represent this issue type
    - The language refers to something else entirely
    - Context clearly and obviously shows this is not a burden and does not lessen state capacity

    **JUSTIFIED**: The burden exists but is clearly necessary
    - Mandated by state or federal statute
    - Clear safety/security/fraud prevention rationale proportionate the burden and/or cost of implementation
    - Limited scope or exceptions minimize impact
    - IMPORTANT: severity IS required (typically 1-3, reflecting low concern)

    **BURDENSOME**: The burden exists without adequate justification
    - No modern alternatives offered
    - Requirement seems outdated or unnecessary
    - Disproportionate to the regulatory goal

    You MUST choose one of these three classifications. Use the context provided
    (definitions, fetched siblings, cross-references from Tier 1 requests) to make
    your determination. When uncertain, default to "unrelated" with lower confidence.

    ## Steelmanning Requirement

    You MUST grapple with the opposing argument in your reasoning:

    **When classifying as BURDENSOME**, your reasoning must explain why the
    argument_for_regulation is insufficient. For example:
    - "While Tier 1 noted fraud prevention as a justification, modern identity verification
      technologies (video calls, biometrics) achieve equivalent security without
      requiring physical presence"

    **When classifying as JUSTIFIED**, your reasoning must explain why the
    argument_against_regulation doesn't outweigh the legitimate purpose:
    - "Although Tier 1's burdensome argument is valid, the statutory mandate in N.J.S.A. 45:1-2
      explicitly requires in-person verification, leaving no state discretion"

    Do NOT simply state both arguments exist. Your reasoning must show you
    weighed them and explain WHY one side prevails.

    ## Tier 3 Routing Flags

    Set these flags to help determine if Tier 3 (web search) is needed:

    **cites_federal_statute** (boolean):
    Set to TRUE if the document cites federal law (CFR, USC, federal statute)

    **federal_citation** (string or null):
    The actual citation (e.g., "42 CFR 483.24") if cites_federal_statute is true

    **claims_no_alternative** (boolean):
    Set to TRUE if you found no electronic/remote alternative mentioned

    **potentially_controversial** (boolean):
    Set to TRUE when ANY of these apply:
    - Requirement affects vulnerable populations (elderly, disabled, low-income) in ways that like provoke public outcry and political debate
    - Requirement involves civil rights or accessibility concerns that are pressing or important in modern debates
    - Relates to modern questions around affordability, power, politically sensitive, or high-profile issues

    These routing flags help determine if additional verification is needed.

    ## Web Search Disambiguation (V5.2)

    When classification is "burdensome" or "justified", provide context to help Tier 3
    find relevant web results (items may reach Tier 3 via multiple routing rules).

    **program_context** (string):
    Describe the specific program, agency, and regulatory domain. Be precise.
    - GOOD: "NJ Division of Gaming Enforcement casino key employee licensing under N.J.A.C. 13:69D"
    - BAD: "NJ licensing requirements"

    **not_to_confuse_with** (array of strings):
    List similar-sounding programs that Tier 3 should NOT treat as relevant.
    Think about what a web search might incorrectly return:
    - Other agencies with similar names
    - Federal programs that sound similar but are different
    - Related but distinct regulatory domains
    - Similar requirements in different contexts

    Example for casino employee licensing:
    ```json
    "not_to_confuse_with": [
      "Federal TSA PreCheck or REAL ID programs",
      "Bank Secrecy Act requirements for casino patrons (different from employees)",
      "General employment background check laws",
      "Other state gaming commission requirements unless comparing alternatives"
    ]
    ```

    **search_scope_guidance** (string):
    One sentence guiding what Tier 3 should focus on vs. avoid.
    - GOOD: "Focus on NJ DGE employee licensing procedures and peer state gaming commission alternatives, not federal banking or transportation security"
    - BAD: "Search for alternatives"

    ## FIELD VALUE CONSTRAINTS (STRICT)

    Your JSON output MUST use EXACTLY these values. Invalid values will cause parsing errors.

    | Field | Allowed Values |
    |-------|----------------|
    | classification | "burdensome", "justified", "unrelated" (exactly one, lowercase) |
    | confidence | 0.0 to 1.0 (decimal, e.g., 0.85) |
    | severity | 1 to 10 (integer only, NEVER 0 or >10; required if burdensome/justified) |
    | context_used[].type | "self", "hierarchy", "sibling", "definition", "cross_reference", "statute", "web" |
    | primary_affected_population | "families", "small_businesses", "licensed_professionals", "government_staff", "vulnerable_populations", "general_public", "healthcare_providers", "childcare_providers", "nonprofits" (null if unrelated) |
    | report_serves_public | true/false/null — only for mandated_reports and reporting_frequency issue types |
    | report_duplicates_existing | true/false/null — only for mandated_reports and reporting_frequency issue types |
    | report_frequency_excessive | true/false/null — only for mandated_reports and reporting_frequency issue types |

    ## Output Format (Final Classification)

    ```json
    {
      "classification": "burdensome",
      "confidence": 0.88,
      "reasoning": "The in-person requirement is burdensome because...",

      "severity": 6,
      "severity_baseline": 5,
      "severity_calculation": "Base 5 (in_person) + 1 (no waiver available) = 6",

      "verbatim_requirements": [
        "the applicant must appear in person at the Division office",
        "in-person verification of credentials is mandatory"
      ],

      "argument_for_regulation": "In-person appearance allows immediate document verification and prevents identity fraud.",

      "argument_against_regulation": "Modern identity verification could achieve the same goals without requiring physical presence.",

      "context_used": [
        {
          "type": "definition",
          "identifier": "applicant",
          "quote": "any person applying for a casino key employee license",
          "relevance": "Clarifies this applies to license applicants"
        }
      ],

      "cites_federal_statute": false,
      "federal_citation": null,
      "claims_no_alternative": true,
      "potentially_controversial": false,
      "primary_affected_population": "licensed_professionals",

      "needs_web_search": true,
      "web_search_topics": [
        "NJ casino employee license remote identity verification",
        "gaming commission digital credential verification alternatives"
      ],

      "program_context": "NJ Division of Gaming Enforcement casino key employee licensing under N.J.A.C. 13:69D",
      "not_to_confuse_with": [
        "Federal TSA PreCheck or REAL ID programs",
        "Bank Secrecy Act requirements for casino patrons (different from employees)",
        "General employment background check laws"
      ],
      "search_scope_guidance": "Focus on NJ DGE employee licensing procedures and peer state gaming commission alternatives, not federal banking or transportation security"
    }
    ```

    **Web Search Guidance**:
    Set `needs_web_search: true` when:
    - Federal statute is cited but state discretion is unclear
    - Claiming no alternative exists but you're uncertain
    - Issue is potentially controversial and needs external validation
    - Understanding the approach of other states, the federal government, or industry standards would inform the analysis
    - It seems like it is something that has a clear public component that might be available on the internet with valuable context
    - There are technical considerations in the burden that could be address by searching the web

    Provide 1-3 specific search topics that would help verify your classification.

  # ─────────────────────────────────────────────────────────────────────────
  # LAYER 2: Issue Block (cached per issue type)
  # ─────────────────────────────────────────────────────────────────────────
  issue_block: |
    ---
    ## Issue Type Configuration

    **Issue Type**: {issue_type}

    **Description**: {issue_description}

    **Severity Scoring**:
    - Baseline: {severity_baseline}
    - Modifiers: {severity_modifiers}

    **Positive Indicators** (likely a real issue):
    {positive_indicators}

    **Negative Indicators** (likely a false positive):
    {negative_indicators}

    **Issue-Specific Examples**:
    {issue_examples}

  # ─────────────────────────────────────────────────────────────────────────
  # LAYER 3: Batch Context (cached per subchapter - shared by siblings)
  # ─────────────────────────────────────────────────────────────────────────
  batch_context: |
    ---
    ## Shared Context (Subchapter: {subchapter_citation})

    ### Ancestor Summaries
    {ancestor_summaries}

    ### All Siblings ({sibling_count} total){sibling_catalog_truncated}
    {sibling_catalog}

    ### Keyword-Matched Sibling Summaries
    {keyword_sibling_summaries}

    ### Inherited Definitions (Scope: {definition_scope})
    {definitions}

  # ─────────────────────────────────────────────────────────────────────────
  # LAYER 4: Document Template (never cached - unique per document)
  # ─────────────────────────────────────────────────────────────────────────
  document_template: |
    ---
    ## Document Under Analysis
    Citation: {citation}
    Title: {title}

    ## Full Content
    {content}

    ## Matches That Passed Tier 1 Filtering
    {relevant_matches}

    ## Tier 1 Argument Framing
    **Burdensome**: {tier1_argument_burdensome}
    **Justified**: {tier1_argument_justified}
    **Unrelated**: {tier1_argument_unrelated}

    ## Fetched Context (Requested by Tier 1)
    {tier1_fetched_context}

    ---

    Analyze this document following the 12-step procedure.
    Consider Tier 1's argument framing and the fetched context above.
    Form your own conclusion based on the full evidence.
    Return your assessment as JSON matching the schema exactly.


# =============================================================================
# TIER 3: WEB SEARCH VERIFICATION (V5)
# =============================================================================
#
# IMPLEMENTATION NOTE (2026-02-11):
# Tier 3 uses a SINGLE-CALL approach with Claude's web_search tool:
# 1. Claude performs web searches using the web_search tool
# 2. Claude submits structured results via the submit_analysis tool call
# 3. We extract JSON directly from the tool_use block (no text parsing)
#
# The user_location parameter localizes searches to the relevant state.
# Citations are extracted from Claude's text blocks (cited_text field).
# =============================================================================

tier3:
  updated_at: "2026-02-18"
  description: "Web search verification with structured evidence flags (tool-call approach)"

  # ─────────────────────────────────────────────────────────────────────────
  # LAYER 1: Static Core (cached globally - same for ALL issue types)
  # ─────────────────────────────────────────────────────────────────────────
  static_core: |
    # Tier 3: Web Search Verification

    You have access to the web_search tool. Use it to validate findings.
    Your goal is to provide structured verification flags with evidence.

    ## Why Items Reach Tier 3

    Items reach Tier 3 when ANY of these triggers apply (V5.1 data-driven routing):

    **High-Risk Issue Types** (newspaper, notarization, wet_signature, witness, mandated_reports, in_person_*):
    - All "justified" classifications escalate (regardless of severity)
    - All items with severity >= 7 escalate

    **Federal/Alternative Claims:**
    - cites_federal_statute = true (needs verification)
    - claims_no_alternative = true AND severity >= 7

    **Confidence-Based:**
    - confidence < 0.85 AND severity >= 7 (low confidence needs validation)

    **Other Triggers:**
    - classification = "justified" AND potentially_controversial = true
    - federal_mandate_suspected = true
    - Random 10% sample for quality assurance

    **SKIP Rule:** Burdensome + high confidence (≥0.85) + severity ≥7 WITHOUT federal statute citation → skipped (data shows only 17% valuable)

    ## Your Task

    1. Use the web_search tool to find authoritative sources
    2. Determine if external sources change the assessment
    3. Provide STRUCTURED FLAGS with evidence for each finding:
       - superseded_by_law: Has a new law replaced/modernized this requirement?
       - federal_mandate_confirmed: Is this actually federally mandated?
       - state_discretion_found: Can this jurisdiction modify/eliminate this?
       - modernized_alternative_found: Are peer jurisdictions or the federal government implementing the same program with modern alternatives?
       - advocacy_for_change: Is there meaningful advocacy (journalism, advocacy groups, publications) calling for this regulation to be changed?

    ## Structured Flag Format (EvidencedFlag)

    Each flag must include:
    - **value** (boolean): Whether the flag is true
    - **scope**: "reg-specific" (applies only to this regulation) or "issue-type/domain" (applies broadly)
    - **reason**: Brief explanation of why this flag is set
    - **evidence**: Array of ContextEntryLLM objects (see schema below)

    IMPORTANT: Evidence items must use these exact field names:
    - **type**: Always "web" for web search results
    - **identifier**: The full URL of the source
    - **quote**: Relevant text from the source
    - **relevance**: Why this source matters

    ```json
    {
      "federal_mandate_confirmed": {
        "value": true,
        "scope": "issue-type/domain",
        "reason": "31 CFR 1021.220 requires identity verification for casino employees",
        "evidence": [
          {
            "type": "web",
            "identifier": "https://www.fincen.gov/guidance",
            "quote": "Casinos must implement identity verification procedures...",
            "relevance": "Confirms federal AML requirements"
          }
        ]
      }
    }
    ```

    ## Classification Adjustment

    Based on web search findings:

    **Reclassify to JUSTIFIED when:**
    - federal_mandate_confirmed.value = true AND state_discretion_found.value = false
    - Evidence shows clear safety/security necessity with no viable alternatives

    **Confirm BURDENSOME when:**
    - federal_mandate_confirmed.value = false (state policy choice)
    - state_discretion_found.value = true (state could change this)
    - modernized_alternative_found.value = true (other states have alternatives)

    **Handle SUPERSEDED BY LAW cases:**
    When superseded_by_law.value = true (e.g., new law eliminates the requirement):
    - DO NOT classify as "unrelated" - the regulation TEXT still creates burden
    - KEEP classification as "burdensome" - the outdated text still affects operations:
      * Staff may not know the law has changed
      * The regulation creates confusion and administrative overhead
      * The regulatory text itself needs cleanup
    - SET severity to baseline 4 (minimally burdensome) regardless of original severity
    - SET easy_cleanup_candidate = true
    - SET cleanup_type = "alternative_authorized"
    - EXPLAIN in reasoning that the burden is now minimal but cleanup is needed

    ## Severity Adjustment Guidelines

    **Decrease severity (-1 to -3) when:**
    - Federal mandate confirmed (jurisdiction has no choice) (-1 to -2)
    - Modernization efforts underway in this jurisdiction (-1)
    - Law has superseded the requirement (set to baseline 4)

    **Increase severity (+1 to +3) when:**
    - Evidence of widespread non-compliance (+1) - suggests impractical burden
    - Peer jurisdictions have modernized but this one hasn't (+1)
    - The federal government has modernized or encourages alternatives that this jurisdiction lacks (+1)
    - `advocacy_for_change.value = true` with credible sources (+1)

    ## Advocacy for Change Flag Guidance

    Search for advocacy calling for this regulation to be changed:
    - News articles, investigative journalism
    - Advocacy group reports and publications
    - Industry trade group position papers
    - Academic papers critiquing the requirement
    - Op-eds from subject matter experts

    **Credible sources include:** established news outlets (newspapers, trade publications),
    recognized advocacy organizations, academic institutions, industry associations.

    **Evaluate for:**
    - Recency (within last 3-5 years preferred)
    - Source credibility (not fringe/anonymous sources)
    - Specificity (calls out this exact regulation or regulatory pattern)

    ## Easy Cleanup Detection

    As you research, identify "low-hanging fruit" - regulations where the burden is
    TRIVIALLY FIXABLE because alternatives already exist:

    ### 1. ALTERNATIVE_IN_PRACTICE (effort: trivial)
    The agency's website or current practice shows they ALREADY accept modern alternatives
    that the regulation text doesn't mention.

    Examples:
    - Regulation says "certified check or money order" but agency website has online payment portal
    - Regulation says "submit in person" but agency has working online submission form
    - Regulation says "mail original document" but agency accepts email/upload

    Evidence to look for:
    - Agency websites with online payment/submission portals
    - FAQ pages mentioning electronic alternatives
    - Forms that include email/online options

    ### 2. ALTERNATIVE_AUTHORIZED (effort: easy)
    This jurisdiction has AUTHORIZED a modern alternative that this regulation hasn't been updated to reference.

    Evidence to look for:
    - Jurisdiction laws authorizing electronic alternatives (e-signatures, e-filing, RON)
    - Executive orders modernizing administrative processes
    - Agency e-filing systems that could apply to this requirement
    - Remote Online Notarization (RON) availability for notarization requirements

    ### 3. PEER_STATE_SOLUTION (effort: medium)
    Peer jurisdictions have successfully modernized this exact type of requirement.

    Evidence to look for:
    - Other states' regulations allowing electronic alternatives
    - Industry-standard modern approaches
    - Federal agencies accepting modern methods

    ---

    ### CRITICAL: Classification Rules for Easy Cleanup Cases

    When you find an easy cleanup opportunity:

    1. **DO NOT classify as "unrelated"** - the regulation TEXT still creates a burden
    2. **KEEP the classification** as burdensome or justified based on the regulation's actual requirements
    3. **LOWER severity** if the alternative is in practice 1-2 points to reflect reduced practical burden
    4. **INCREASE severity** if peer jurisdictions have modernized but this one hasn't
    4. **SET easy_cleanup_candidate = true**
    5. **PROVIDE specific evidence** - URL where you found the alternative
    6. **RECOMMEND specific fix** - e.g., "Update [regulatory citation] to add 'or electronic payment'"

    ## Source Evaluation

    Classify each source:
    - **government**: Official government sources (most authoritative)
    - **academic**: Peer-reviewed research, university publications
    - **journalism**: News articles, investigative reporting
    - **advocacy**: Industry groups, advocacy organizations

    ## Evidence Gap Flag

    Set `evidence_gap: true` when:
    - Web search returned no relevant results
    - Search results were too generic to inform the analysis
    - Cannot determine federal mandate status from available sources

    This indicates lower confidence in the Tier 3 assessment.

    ## FIELD VALUE CONSTRAINTS (STRICT)

    Your JSON output MUST use EXACTLY these values. Invalid values will cause parsing errors.

    ### Core Fields
    | Field | Allowed Values |
    |-------|----------------|
    | classification | "burdensome", "justified", "unrelated" (exactly one, lowercase) |
    | confidence | 0.0 to 1.0 (decimal, e.g., 0.85) |
    | final_severity | 1 to 10 (integer only, NEVER 0 or >10 or negative) |
    | severity_adjustment | -4 to +4 (integer only, NEVER < -4 or > +4) |

    ### EvidencedFlag Objects (superseded_by_law, federal_mandate_confirmed, state_discretion_found, modernized_alternative_found)
    Each flag is an OBJECT with these fields:
    | Field | Allowed Values |
    |-------|----------------|
    | value | true or false (boolean, required) |
    | scope | "reg-specific", "issue-type/domain" (required) |
    | reason | string explaining why (required) |
    | evidence | array of {type, identifier, quote, relevance} objects |
    | evidence[].type | "self", "hierarchy", "sibling", "definition", "cross_reference", "statute", "web" (use "web" for search results) |

    ### Boolean Flags
    | Field | Allowed Values |
    |-------|----------------|
    | evidence_gap | true or false |
    | federal_mandate_found | true or false |
    | state_has_discretion | true or false |
    | easy_cleanup_candidate | true or false |

    ### Easy Cleanup Fields (only if easy_cleanup_candidate = true)
    | Field | Allowed Values |
    |-------|----------------|
    | cleanup_type | "alternative_in_practice", "alternative_authorized", "peer_state_solution" (or null) |
    | cleanup_effort | "trivial", "easy", "medium" (or null) |

    **CRITICAL**:
    - If superseded by law, set final_severity to 4 (not 0, not negative)
    - severity_adjustment is RELATIVE to Tier 2's severity (-3 to +3 range only)
    - Do NOT invent new enum values (e.g., NO "superseded_by_law" as cleanup_type)
    - EvidencedFlag fields are OBJECTS, not booleans - use {value: true/false, scope: "...", reason: "...", evidence: []}

    ## Output Format

    After performing web searches, you MUST call the `submit_analysis` tool to submit your structured assessment. Do NOT output JSON as text — use the tool.

    The tool requires these fields (see tool schema for details):
    - classification, confidence, reasoning
    - final_severity, severity_adjustment, severity_adjustment_reasoning
    - argument_for_regulation, argument_against_regulation
    - web_search_summary, verbatim_requirements
    - Structured flags (as objects with value/scope/reason): superseded_by_law, federal_mandate_confirmed, state_discretion_found, modernized_alternative_found, advocacy_for_change
    - Simple booleans: evidence_gap, federal_mandate_found, state_has_discretion, easy_cleanup_candidate
    - If easy_cleanup_candidate is true: cleanup_type, cleanup_evidence, cleanup_recommendation, cleanup_effort

