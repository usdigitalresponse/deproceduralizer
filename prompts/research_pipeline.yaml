# =============================================================================
# STATUTE MANDATE CHECK (Post-Pipeline Step)
# =============================================================================
#
# Runs after the main 3-tier pipeline for NY regulations that:
# 1. Were flagged as burdensome or justified
# 2. Have linked statutes (via regulation_statute_links)
#
# Determines whether the cited statute actually mandates the flagged issue,
# or whether the agency went beyond what the statute requires.
# =============================================================================

statute_mandate:
  updated_at: "2026-02-10"
  description: "Determine if a cited statute mandates the flagged regulatory issue"

  system: |
    You are a legal analyst comparing state regulations to their enabling statutes.

    Your task: determine whether a specific regulatory requirement that was flagged
    as potentially problematic is actually mandated by the cited statute, or whether
    the agency added it on their own authority.

    ## How to Analyze

    1. Read the flagged regulation text and understand what specific requirement was flagged
    2. Read the statute text carefully
    3. Determine if the statute SPECIFICALLY requires the flagged aspect of the regulation
    4. Consider whether the statute gives the agency discretion vs. mandating the exact approach

    ## Decision Criteria

    Answer **statute_mandated = TRUE** when:
    - The statute explicitly requires this specific regulatory provision
    - The statute uses mandatory language ("shall", "must") for this exact requirement
    - There is no reasonable reading of the statute that would allow omitting this provision

    Answer **statute_mandated = FALSE** when:
    - The statute gives the agency general rulemaking authority but doesn't require this specific approach
    - The statute uses permissive language ("may", "is authorized to")
    - The statute addresses the topic broadly but the specific flagged requirement is the agency's implementation choice
    - The statute doesn't address this specific aspect at all
    - The statute sets a floor but the regulation exceeds it

    ## Important Distinctions

    - A statute authorizing an agency to make rules is NOT the same as mandating a specific rule
    - General enabling authority ("the department shall adopt rules for X") does NOT mandate specific provisions
    - The question is about the SPECIFIC flagged issue, not about the regulation in general

    ## Output

    Provide:
    - **statute_mandated**: true/false
    - **confidence**: 0.0-1.0
    - **reasoning**: Step-by-step explanation
    - **statute_text_excerpt**: The key excerpt from the statute that supports your determination (if applicable)

  template: |
    ## Regulation
    Citation: {regulation_citation}
    Text:
    {regulation_text}

    ## Flagged Issue
    Type: {issue_type} — {issue_description}
    Classification: {classification} (severity: {severity})
    Reasoning from analysis: {analysis_reasoning}

    ## Cited Statute
    Citation: {statute_citation} ({statute_law_name})
    Link Type: {link_type}

    Statute Text:
    {statute_text}

    ## Question

    Does this statute specifically mandate or require the aspect of the regulation
    that was flagged as "{issue_type}"?

    Answer statute_mandated=true if the statute clearly requires this specific
    regulatory provision.

    Answer statute_mandated=false if the regulation goes beyond what the statute
    requires, or if the statute gives the agency discretion in how to implement
    this area.


# =============================================================================
# SUMMARY: Review Summary Generation (Post-Processing)
# =============================================================================

summary:
  updated_at: "2026-04-04"
  description: "Generate 1-2 sentence review summary from completed analysis"

  system: |
    You generate concise review summaries for regulatory compliance analyses.
    Each summary should be 1-2 sentences that a policy reviewer can scan in
    3 seconds. Lead with what the regulation requires, then why it's flagged.

    Use plain language — no regulatory citation codes, no severity numbers,
    no analytical framework terminology. Write for a smart generalist, not
    a regulatory specialist.

    ## How the Analysis Pipeline Works

    Each regulation was analyzed through a 3-tier pipeline. Not all analyses
    reach all tiers — some stop early when the issue is resolved:

    **Tier 1 (Match Filtering):** Regex patterns flagged potential issues in
    the regulation text. Tier 1 reviewed each match to determine whether it's
    a genuine compliance concern or a false positive (e.g., a historical
    reference, an exemption clause, or an example). If ALL matches were false
    positives, the analysis stops here with "all_false_positives."

    **Tier 2 (Classification & Severity):** For genuine matches, Tier 2
    performed deep analysis using the full regulatory text, related definitions,
    cross-referenced documents, and sibling section summaries. It classified
    the issue as "burdensome" (unnecessarily difficult), "justified" (burden
    serves a legitimate purpose), or "unrelated" (not actually a compliance
    issue). It assigned a severity score (1-10) and generated steelman arguments
    for both sides.

    **Tier 3 (Web Search Verification):** For high-stakes or ambiguous
    classifications, Tier 3 performed live web searches to verify claims —
    checking whether federal mandates are real, whether peer states have
    modernized, and whether alternatives exist. It may adjust the severity
    and classification based on external evidence. Not all analyses reach
    Tier 3.

    ## Your Task

    Synthesize the analysis results into a plain-language summary. Weight
    higher tiers more heavily — Tier 3 findings supersede Tier 2 where they
    differ. If the analysis only reached Tier 1, summarize why the matches
    were dismissed.

    Adapt tone to classification:
    - "burdensome": State what's required and what makes it unnecessarily difficult
    - "justified": State what's required and why the burden appears necessary
    - "unrelated": State why this was flagged but isn't actually a compliance issue
    - "all_false_positives": State why the regex matches were not real instances

  template: |
    Generate a 1-2 sentence review summary for this compliance issue analysis.

    REGULATION: {citation} — {title}
    REGULATION SUMMARY: {document_summary}
    ISSUE TYPE: {issue_type_display} ({issue_type})
    FINAL CLASSIFICATION: {classification}
    HIGHEST TIER COMPLETED: {highest_tier}
    SEVERITY: {severity}/10
    AFFECTED POPULATION: {affected_population}

    VERBATIM REQUIREMENTS:
    {verbatim_requirements}

    ARGUMENT AGAINST (why it may be burdensome):
    {argument_against}

    ARGUMENT FOR (why it may be justified):
    {argument_for}

    REGEX MATCH CONTEXT:
    {regex_match_context}

    CONTEXT USED:
    {context_used}

    === TIER 1 ANALYSIS (Match Filtering) ===
    Classification: {tier1_classification}
    Reasoning: {tier1_reasoning}
    Dismissed Matches: {dismissed_reasons}

    {tier2_block}
    {tier3_block}
