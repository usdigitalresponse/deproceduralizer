    Use the web_search tool to research this regulation.

    **IMPORTANT - Search Disambiguation**:
    - The "Program Context" above identifies the EXACT program/agency you're researching
    - The "NOT to confuse with" list shows similar-sounding programs that are IRRELEVANT
    - If a search result is about something in the "NOT to confuse with" list, IGNORE IT
    - Focus your searches and analysis ONLY on the specific program context

    Focus on:
    1. Whether this requirement is federally mandated
    2. Whether other states have modernized alternatives
    3. Whether NJ has discretion to change this requirement

    After completing your web searches, output your assessment as JSON with:
    - Structured flags (superseded_by_law, federal_mandate_confirmed, state_discretion_found, modernized_alternative_found)
    - Each flag with value, scope, reason, and evidence array
    - Set evidence_gap: true if web search was inconclusive
    - Adjust classification and severity based on findings
    - Include web_search_summary with key findings
