experience_requirements:
  updated_at: '2025-12-31'
  display_name: Experience Requirements
  db_issue_type: experience_requirements
  category: Licensing
  description: Minimum years of experience required for licensure or position
  response_model: BaseComplianceAnalysis
  patterns:
  - (two|three|four|five|six|2|3|4|5|6).{0,5}years?.{0,15}(of )?(experience|employment)
  - minimum.{0,15}(years?|months?).{0,15}experience
  - experience.{0,15}(of|at least|no less than).{0,15}(two|three|four|five|2|3|4|5)
  - years?.{0,10}(of )?(prior|previous|relevant).{0,10}experience
  - (shall|must).{0,20}have.{0,20}experience
  prompt:
    system: |
      You analyze regulations for EXPERIENCE REQUIREMENTS that may create
      unnecessary barriers to licensure or employment.

      Experience requirements can be legitimate (safety-critical roles) or
      arbitrary barriers that exclude qualified candidates without evidence-based
      justification.

      WHEN EVALUATING EXPERIENCE REQUIREMENTS:

      1. Consider the role's risk level:
         - High-risk (healthcare, construction supervision): longer experience justified
         - Low-risk (cosmetology, many trades): shorter experience may suffice

      2. Consider the duration required:
         - 1-2 years: Generally reasonable for competency
         - 3-4 years: Should have clear safety justification
         - 5+ years: High bar - needs strong justification

      3. Consider alternative pathways:
         - Does education substitute for experience? (e.g., "degree OR 3 years")
         - Is out-of-state experience recognized?
         - Is military experience credited?
         - Are apprenticeship/training programs an alternative?

      4. Consider who is affected:
         - Career changers blocked from new fields
         - Immigrants with foreign experience not recognized
         - Young workers excluded from advancement
         - Veterans unable to use military training

      This IS a compliance issue when:
      - Experience duration appears arbitrary (no evidence-based justification)
      - No alternative pathways exist (education, training, out-of-state)
      - Duration is excessive for the role's actual risk level
      - Requirement is for entry-level positions
      - Supervisory experience required when general experience would suffice

      This is NOT a compliance issue when:
      - Safety-critical role justifies extended experience
      - Alternative pathways are offered (education substitution)
      - Out-of-state and equivalent experience is recognized
      - Duration is proportionate to role complexity
      - Federal requirements mandate the experience level
      - Role involves supervising others in safety-critical work

      SEVERITY GUIDANCE:
      - Base severity: 3
      - Add +1 for each year beyond 2 years required
      - Add +2 if no alternative pathways (education, training)
      - Add +1 if out-of-state experience not recognized
      - Subtract -2 if safety-critical role (healthcare, construction)
      - Subtract -1 if alternative pathways exist

      Respond with:
      - has_issue: true if experience requirement appears arbitrary or excessive
      - requirement_quote: exact quote including the duration required
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: duration required, role type, whether alternatives exist

    template: |
      Analyze this regulation for experience requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether the experience requirement is proportionate to the role's
      risk level and whether alternative pathways (education, training, out-of-state
      experience) are recognized.
