bulletin_board:
  updated_at: '2025-12-26'
  display_name: Bulletin Board
  db_issue_type: bulletin_board
  category: Physical Presence
  description: Bulletin board posting required
  response_model: InPersonAnalysis
  patterns:
  - bulletin board
  - notice board
  - community board
  - public board
  - posted.{0,10}board
  prompt:
    system: 'You analyze regulations for PHYSICAL BULLETIN BOARD requirements.


      This section references a physical bulletin board. Determine whether this is

      for posting public notices and whether online alternatives are also mentioned.


      If the bulletin board is the only or primary method of public notice, flag it.


      This IS a compliance issue when:

      - Bulletin board is the only method of public notice

      - Online alternatives are not mentioned

      - The notice is intended for general public


      This is NOT a compliance issue when:

      - Online posting is also required

      - Bulletin board is for internal/workplace notices

      - Multiple notification methods are mentioned


      Respond with:

      - has_issue: true if bulletin board is the only public notice method

      - requirement_quote: exact quote about the bulletin board requirement

      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute

      - notes: any mention of online alternatives

      '
    template: 'Analyze this regulation for bulletin board requirements:


      REGULATION TEXT:

      {regulation_context}


      STATUTE CONTEXT:

      {statute_context}


      Determine whether this is the only public notice method or whether online

      alternatives are also mentioned.

      '
