# =============================================================================
# Centralized Prompts for LLM Analysis
# =============================================================================
#
# This file contains prompt templates loaded via shared_utils.load_prompt().
# Templates use {variable_name} placeholders that get filled at runtime.
#
# ARCHITECTURE NOTE: This project has TWO prompt systems:
#
# 1. prompts.yaml (this file) - For analysis prompts loaded via load_prompt()
#    - red_flags_analysis: Implementation complexity analysis
#    - definition_extraction: Term definition extraction
#    - wet_signature_*: DSPy prompt optimization training
#
# 2. backend/scripts/compliance_issues/compliance_issues.yaml
#    - For all 40 compliance issue types (mail_only, fax, notarization, etc.)
#    - Contains BOTH regex patterns AND LLM prompts together
#    - Loaded by: backend/scripts/compliance_issues/config.py
#
# Usage:
#   from shared_utils import load_prompt
#   prompt = load_prompt("red_flags_analysis", section_text="...", citation="...", heading="...")
#

# -----------------------------------------------------------------------------
# RED FLAGS ANALYSIS - Jennifer Pahlka Implementation Complexity Framework
# -----------------------------------------------------------------------------
# Used by: backend/scripts/red_flags.py
# Variables: section_text, citation, heading
#
# CACHING: The 'system' prompt is static and cached across all batch requests.
# Only the 'template' (user message) varies per document.

red_flags_analysis:
  description: |
    Analyzes regulation sections for implementation complexity using Jennifer Pahlka's
    framework from "Recoding America". Identifies 12 categories of regulatory patterns
    that create implementation barriers or opportunities.

  # Static system prompt - cached across all requests in a batch
  system: |
    You analyze regulation sections for implementation complexity using Jennifer Pahlka's framework from "Recoding America".

    ANALYSIS FRAMEWORK - 12 CATEGORIES:

    1. COMPLEXITY_POLICY_DEBT - Cross-reference spaghetti, accreted conditions
       RED FLAG EXAMPLE: "meets criteria in section 202(b)(3)(A)(ii); satisfies 26 U.S.C. 3304(a)(1)(B)"
       BETTER: "household income is below 150% of federal poverty level"
       DETECT: 3+ cross-references to other sections/USC in a single requirement, or subsection chains 3+ levels deep (e.g., §1-2(a)(3)(B)(ii)), or compound conditions requiring navigation across multiple external sources

    2. OPTIONS_BECOME_REQUIREMENTS - Suggestion lists become checklists
       RED FLAG EXAMPLE: "may include...all controls identified in NIST Special Publication 800-53"
       BETTER: "shall adopt controls proportionate to data sensitivity...not required to adopt every listed control"
       DETECT: "may include" followed by exhaustive lists (5+ items) without prioritization, or "may consider" followed by "all of the following", or suggestion language combined with comprehensive external standards

    3. POLICY_IMPLEMENTATION_SEPARATION - Waterfall, vendor lock-in
       RED FLAG EXAMPLE: "shall establish through contracts with private entities...shall not directly develop or operate"
       BETTER: "shall designate accountable official responsible for how service works...may use contractors but retain ability to change"
       DETECT: Explicit prohibition on government operation/development, mandatory use of specific vendor types, or separation of policy design from implementation responsibility

    4. OVERWROUGHT_LEGALESE - Dense definitions that make forms impossible
       RED FLAG EXAMPLE: "gross unearned income as defined in subsection (k)(2)(B)...per Internal Revenue Code §152"
       BETTER: "ask in plain language about money from work and other sources like Social Security, pensions"
       DETECT: Tax code references, nested definitions, legalese that can't be translated to plain forms

    5. CASCADE_OF_RIGIDITY - Conflicting absolute goals
       RED FLAG EXAMPLE: "shall maximize access AND minimize improper payments AND ensure uniform administration AND promote personal responsibility AND avoid any potential misuse"
       BETTER: "main goals: (1) people who qualify can get benefits, (2) limit serious abuse. Balance: don't reduce access unless preventing larger harm"
       DETECT: Multiple unprioritized absolute goals, "comply with all applicable", "ensure", "maximize", "minimize" without trade-offs

    6. MANDATED_STEPS_NOT_OUTCOMES - Procedure-heavy vs outcome-focused
       RED FLAG EXAMPLE: "require Form X-100 in PDF format...upload all documents in PDF...issue decision within 90 days of receipt of completed Form X-100"
       BETTER: "decide 90% of complete applications within 10 days...may change forms and formats to improve use"
       DETECT: Hard-coded forms/formats, specific tech requirements (PDF, portals, CMS), step checklists instead of metrics

    7. ADMINISTRATIVE_BURDENS - Friction: notaries, wet signatures, in-person
       RED FLAG EXAMPLE: "certified birth certificate...notarized affidavit...appear in person every 3 months...original documents...satisfied within 7 days failing which application shall be denied"
       BETTER: "accept any reasonable proof...use existing government records...recertify by mail/online/phone...30 days to respond...multiple contact attempts before denial"
       DETECT: "notarized", "certified", "original", "in person", "wet signature", "appear", "sworn", recurring appearances, unrealistic deadlines, denial by default

    8. NO_FEEDBACK_LOOPS - One-shot design, no iteration
       RED FLAG EXAMPLE: "program authorized for 10 years...Comptroller General shall submit report after 9 years"
       BETTER: "Secretary may run pilots to simplify forms...track completion rates and time to decision...if trial helps people get benefits without major errors, extend nationwide...regularly ask frontline staff which rules cause problems"
       DETECT: No pilot authority, no iteration language, one final report, no user testing, no field feedback mechanisms

    9. PROCESS_WORSHIP_OVERSIGHT - Compliance-only audits
       RED FLAG EXAMPLE: "Inspector General shall audit compliance with each requirement...report any deviations however minor...any employee authorizing deviation may be subject to disciplinary action"
       BETTER: "IG shall examine whether program reaches qualifying people AND whether rules are reasonable...when agency departs from procedures, consider whether change helped people get benefits or solved documented problem"
       DETECT: Audit "all requirements", punish "any deviation", no outcome focus, blame-oriented language

    10. ZERO_RISK_LANGUAGE - Impossible absolutes
        RED FLAG EXAMPLE: "shall take all necessary measures to ensure that no improper payments occur...ensure that no unauthorized access ever occurs"
        BETTER: "use reasonable steps to reduce errors and abuse, recognizing eliminating every small error would keep qualifying people from help...manage security so serious breaches are unlikely and systems remain available"
        DETECT: "ensure no X occurs", "never", "all necessary measures", "zero", absolutes that ignore trade-offs

    11. FROZEN_TECHNOLOGY - Hard-coded architectures, formats, platforms
        RED FLAG EXAMPLE: "create website at www.benefits2025.gov using commercial CMS and enterprise service bus architecture...provide downloadable PDF forms...optimized for desktop web browsers"
        BETTER: "provide online service on .gov domain that allows people to see eligibility, apply, check status...usable on mobile devices...Secretary may change underlying technology"
        DETECT: Named systems/architectures (ESB, specific CMS), hard-coded formats (PDF only), specific URLs, browser requirements, vendor names

    12. IMPLEMENTATION_OPPORTUNITY - POSITIVE patterns
        GOOD EXAMPLES:
        - "decide 90% of applications within 10 days" (concrete delivery metric)
        - "Secretary shall design forms so most people can complete on mobile phone" (burden reduction)
        - "Secretary may test simpler ways and keep versions that help qualifying people" (iteration authority)
        - "every 5 years review rules and recommend which can be removed because they add steps without improving results" (cleanup)
        - "identify groups where qualifying people aren't getting benefits and propose changes to close gaps" (outcome focus)
        DETECT: Plain language mandates, concrete metrics, burden reduction, pilot authority, outcome focus, regular cleanup

    ---

    REPORTING REQUIREMENTS DETECTION:

    Check if the regulation creates any reporting requirements (binary flag):
    - "shall report...", "must submit reports...", "shall file...", "shall provide reports..."
    - "shall submit annual/quarterly/monthly reports to..."
    - "shall notify...", "shall inform...", "shall document and report..."
    - "shall issue reports...", "shall maintain records and report..."

    EXAMPLES THAT TRIGGER REPORTING FLAG:
    - "shall submit quarterly reports to the Commissioner detailing..."
    - "must file annual compliance reports with the Department"
    - "shall report all incidents within 24 hours"
    - "shall notify stakeholders of policy changes"
    - "shall maintain documentation and provide annual reports"

    EXAMPLES THAT DON'T:
    - "shall follow procedures" (procedural requirement, not reporting)
    - "shall maintain records" (recordkeeping only, not reporting)
    - "shall consider factors" (analytical requirement, not reporting)

    has_reporting_requirement: true if section creates any requirement to submit, file, report, or notify; false otherwise.

    ---

    IMPORTANT: Only flag issues that are CLEAR and SUBSTANTIVE matches to the patterns described above.
    - Do not flag minor or tangential instances
    - Require strong evidence in the matched_phrases
    - Be conservative and precise in classifications
    - Avoid over-interpreting routine legal language as problematic
    - Focus on patterns that would genuinely create implementation barriers or burdens

    For each issue found, provide:
    - explanation: [why this creates implementation burden or opportunity, 50-200 chars]
    - severity: [1-10 scale where 1-3=LOW, 4-6=MEDIUM, 7-10=HIGH]
    - complexity: [HIGH | MEDIUM | LOW based on implementation difficulty]
    - matched_phrases: [1-20 exact quotes from section text that demonstrate the issue]
    - implementation_approach: [how to implement this better, or what approach is needed]
    - effort_estimate: [rough estimate of implementation difficulty/timeline, optional]

    Overall assessment:
    - has_implementation_issues: true if section has ANY category 1-11 issues (false if only category 12 or no issues)
    - overall_complexity: [HIGH | MEDIUM | LOW based on highest individual complexity, null if no issues]
    - summary: [2-3 sentences about main implementation concerns or opportunities]
    - requires_technical_review: true if section needs architects/engineers to design implementation approach
    - has_reporting_requirement: true if section creates reporting/filing/notification requirements, false otherwise

    Return VALID JSON with red_flags as an array of objects (each with a category field), plus the overall assessment fields.

    Example output:
    {{
      "has_implementation_issues": true,
      "red_flags": [
        {{
          "category": "complexity_policy_debt",
          "explanation": "Contains 47 cross-references making it impossible to follow",
          "severity": 8,
          "complexity": "HIGH",
          "matched_phrases": ["See section 4.1.2(a)(3)"],
          "implementation_approach": "Consolidate into clear statements",
          "text_examples": ["meets criteria in section 202(b)(3)"]
        }}
      ],
      "overall_complexity": "HIGH",
      "summary": "Has cross-reference and legalese issues.",
      "requires_technical_review": true,
      "has_reporting_requirement": true
    }}

  # Dynamic user prompt - unique per document (not cached)
  template: |
    Analyze this regulation section:

    CITATION: {citation}
    HEADING: {heading}

    SECTION TEXT:
    {section_text}


# -----------------------------------------------------------------------------
# WET SIGNATURE DETECTION
# -----------------------------------------------------------------------------
# Used by: backend/scripts/search_signatures.py
# Variables: regulation_context, statute_context (optional)

wet_signature_detection:
  description: |
    Analyzes regulations to determine if they require wet (physical/ink) signatures,
    distinguishing between explicit wet signature requirements and generic signature
    language that allows electronic signatures.

  template: |
    Does this New Jersey regulation require a WET SIGNATURE?

    IMPORTANT: A "wet signature" requirement means the text EXPLICITLY requires one of:
    - "wet signature"
    - "original signature"
    - "ink signature"
    - "handwritten signature"
    - "physical signature"
    - "signed in ink"
    - "manually signed"
    - Explicit prohibition of electronic/digital/fax signatures

    Generic phrases like "shall be signed", "must be signed", "signature required", or "bear the signature of" do NOT count as wet signature requirements. These allow electronic signatures under modern law.

    REGULATION TEXT:
    {regulation_context}

wet_signature_detection_with_statute:
  description: |
    Extension of wet signature detection that includes statute context for
    determining whether the requirement originates from statute or regulation.

  template: |
    STATUTE TEXT (N.J.S.A. references found in regulation):
    {statute_context}

    TASK: Check if the wet signature requirement appears in the statute text above.
    - If YES: Find the exact quote from the statute that establishes the requirement
    - If NO: The regulation added this requirement beyond what the statute says

wet_signature_response_format:
  description: |
    JSON response format for wet signature detection.

  template: |
    Answer with ONLY valid JSON:
    {{
      "has_wet_signature_requirement": <true if EXPLICIT wet/ink/handwritten/original/physical requirement, false otherwise>,
      "requirement_quote": <exact quote from REGULATION about signature requirement (extract even if it's not a wet signature requirement)>,
      "from_statute": <true if requirement is in statute text, false if regulation adds it, null if no statute provided or no requirement>,
      "statute_quote": <exact quote from STATUTE TEXT if from_statute is true, null otherwise>
    }}


# -----------------------------------------------------------------------------
# DEFINITION EXTRACTION
# -----------------------------------------------------------------------------
# Used by: backend/scripts/extract_definitions.py
# Variables: title, content
#
# This prompt is structured for optimal caching:
# - System prompt (static) is cached across all requests in a batch
# - User template (dynamic) varies per request

definition_extraction:
  description: |
    Extracts term definitions from regulation sections.
    Prompt is structured for optimal caching - static instructions first.

  # Static system prompt (cached across all requests in a batch)
  system: |
    You are an expert at extracting term definitions from legal regulations.

    CRITICAL PRINCIPLE: When uncertain, choose the option that reduces false positives.
    It is better to miss a definition than to extract something that is not a definition.

    DEFINITELY A DEFINITION (ALWAYS EXTRACT):
    Patterns that explicitly assign meaning to a term:
    - "X means Y"
    - "X shall mean Y"
    - "For purposes of this [section/part], X is defined as Y"
    - "(a) X. [definition text]" in a definitions section

    MIGHT BE A DEFINITION (EXTRACT IF CLEARLY PROVIDING MEANING):
    - Cross-references that establish what a term means: "X, as defined in [external source]"
    - Inline explanations: "X (meaning Y)"
    - Contextual definitions: "X refers to Y"
    Use judgment - extract if the text is clearly providing the meaning of a term

    NOT A DEFINITION (DO NOT EXTRACT):
    - Numeric thresholds or criteria (e.g., "300 beds", "10 days", "$500")
    - Category labels in parentheses (e.g., "("-300 bed")", "(HBF)" without expansion)
    - Citations to laws without definitions (e.g., "chapter 506 of the laws of 2009")
    - General descriptions of requirements or procedures
    - Examples or illustrations

    VERBATIM TEXT vs COMPLETE DEFINITION:
    - verbatim_text: Always extract the EXACT text from the regulation
    - is_verbatim_text_complete: Set to TRUE only if verbatim_text is a complete, usable definition
    - is_verbatim_text_complete: Set to FALSE when the text is a cross-reference or incomplete
    - Do NOT include "X means..." prefix in verbatim_text - it's redundant
    - Do NOT include "hereinafter referred to as X" suffix for abbreviations

    REPHRASED DEFINITION:
    - Only provide rephrased_definition when verbatim_text is NOT a complete, usable definition
    - Leave blank/null if verbatim_text is sufficient (is_verbatim_text_complete=true)
    - The rephrased version should be a plain-language summary of what the term means
    - This is OPTIONAL - when uncertain, leave it blank

    DEFINITION TYPES:
    - type="formal": Found in definitions sections, uses "means"/"shall mean" patterns
    - type="abbreviation": Inline shorthand like "New York State ("State")"

    NOTE: Two types are sufficient because:
    - Cross-references are captured via `is_cross_reference` boolean (not a type)
    - Scope/context is captured via `scope` and `scope_level` fields
    - Source (statute vs regulation) is inferable from `document_id`
    - The schema uses VARCHAR(20) without CHECK constraint for future extensibility

    SCOPE LEVEL MAPPING (use exact match - do not confuse similar terms):
    - "in this section" → scope_level="section"
    - "in this subpart" → scope_level="subpart"
    - "in this part" or "in this Part" → scope_level="part"
    - "in this subchapter" → scope_level="subchapter"
    - "in this chapter" → scope_level="chapter"
    - "in this subtitle" → scope_level="subtitle"
    - "in this title" → scope_level="title"
    - No scope phrase → scope_level=null

    CRITICAL: Only extract scope from EXPLICIT phrases in the text like:
    - "For purposes of this Part..."
    - "As used in this Chapter..."
    - "In this Title, X means..."

    DO NOT infer or guess scope from context (e.g., "this definition is in Chapter V
    so it probably applies to the chapter"). If there is no explicit scope phrase,
    set BOTH scope=null AND scope_level=null. Never hallucinate a scope.

    IMPORTANT: "subpart" and "subchapter" are DIFFERENT levels. Match exactly.

    CROSS-REFERENCE DETECTION:
    - Set is_cross_reference=true for phrases like:
      * "has the meaning given in section X"
      * "as defined in [external reference]"
      * "has the same meaning as"
      * "see section X for definition"
      * "pursuant to..." or "in accordance with..." followed by statute/regulation

    CROSS-REFERENCE CATEGORIZATION (two dimensions):
    When is_cross_reference is true, also categorize:

    1. reference_completeness:
       - "pure_pointer": The definition exists entirely elsewhere, verbatim_text is just a pointer
         Example: "as defined in N.J.A.C. 3A:23-1.1"
       - "hybrid": Has substantive inline definition PLUS external reference
         Example: "a person certified... in accordance with N.J.S.A. 45:11-45"

    2. reference_target:
       - "same_corpus": References other NJ/NY regulations (N.J.A.C., N.J.S.A., NYCRR, etc.)
       - "federal": References federal law/regulations (CFR, USC, U.S.C., Internal Revenue Code)
       - "external_standard": References industry orgs, professional bodies (AMA, Coast Guard, NFPA, ASTM)
       - "other": Other jurisdictions, international standards, or unclear references

    NOT A CROSS-REFERENCE (do NOT set is_cross_reference):
    - "Manual of Requirements" referenced but full definition is inline → is_cross_reference=true (reference to requirements)
    - Simple abbreviations like "Department means the Department of Health" → is_cross_reference=false

    INCORPORATION BY REFERENCE - DO NOT EXTRACT:
    Statements like "The definitions in N.J.A.C. 3A:11 are incorporated by reference"
    are NOT definitions - they incorporate MULTIPLE definitions. Do not extract these.

    IMPORTANT: When uncertain about whether something is a definition,
    DO NOT extract it. False positives are costly to clean up.

    ---
    TRAINING EXAMPLES FROM HUMAN REVIEW
    ---

    CORRECT EXTRACTION EXAMPLE 1 - Hybrid cross-reference to same corpus:
    SOURCE: "Civil union" means the legally recognized union of two eligible individuals
            of the same sex, established pursuant to P.L. 2006 c. 103, N.J.S.A. 37:1-28
            et seq. Parties to a civil union shall receive the same benefits...
    EXTRACTION:
      term: "Civil union"
      verbatim_text: "the legally recognized union of two eligible individuals of the same sex, established pursuant to P.L. 2006 c. 103, N.J.S.A. 37:1-28 et seq..."
      is_verbatim_text_complete: true
      is_cross_reference: true
      reference_completeness: "hybrid"
      reference_target: "same_corpus"
    WHY: is_verbatim_text_complete=true because inline text fully explains the term;
         is_cross_reference=true because it references N.J.S.A.; hybrid because has inline + reference

    CORRECT EXTRACTION EXAMPLE 2 - Pure pointer to same corpus:
    SOURCE: "Child with special needs" means as defined in N.J.A.C. 3A:23-1.1.
    EXTRACTION:
      term: "child with special needs"
      verbatim_text: "as defined in N.J.A.C. 3A:23-1.1"
      is_verbatim_text_complete: false
      rephrased_definition: "A child with special needs as defined in N.J.A.C. 3A:23-1.1"
      is_cross_reference: true
      reference_completeness: "pure_pointer"
      reference_target: "same_corpus"
    WHY: pure_pointer because definition exists entirely elsewhere; rephrased_definition makes it displayable

    CORRECT EXTRACTION EXAMPLE 3 - Hybrid to external standard:
    SOURCE: Personal flotation devices (PFD) (life jackets) rated Class I, II, or III
            by the United States (U.S.) Coast Guard.
    EXTRACTION:
      term: "personal flotation devices (PFD)"
      verbatim_text: "personal flotation devices (PFD) (life jackets) rated Class I, II, or III by the U.S. Coast Guard"
      is_verbatim_text_complete: false
      rephrased_definition: "A Class I, II, or III personal flotation device as rated by the U.S. Coast Guard"
      is_cross_reference: true
      reference_completeness: "hybrid"
      reference_target: "external_standard"
    WHY: external_standard because Coast Guard ratings are external; hybrid because has inline context

    CORRECT EXTRACTION EXAMPLE 4 - Simple abbreviation (no cross-reference):
    SOURCE: "Department" means the New Jersey Department of Children and Families.
    EXTRACTION:
      term: "Department"
      verbatim_text: "the New Jersey Department of Children and Families"
      is_verbatim_text_complete: true
      is_cross_reference: false
      reference_completeness: null
      reference_target: null
      definition_type: "abbreviation"
    WHY: No external reference, so cross-reference fields are null

    COMMON ERRORS TO AVOID:

    ERROR 1 - Including "X means..." in verbatim_text:
    BAD:  verbatim_text: "Chapter\" means the rules contained in the Manual..."
    GOOD: verbatim_text: "the rules contained in the Manual of Requirements..."

    ERROR 2 - Including "hereinafter" for abbreviations:
    BAD:  verbatim_text: "the New Jersey Motor Vehicle Commission, hereinafter referred to as the MVC"
    GOOD: verbatim_text: "the New Jersey Motor Vehicle Commission" (use rephrased_definition to clean up)

    ERROR 3 - Not marking cross-references:
    BAD:  is_cross_reference: false (when text says "in accordance with N.J.S.A. 45:11-45")
    GOOD: is_cross_reference: true, reference_completeness: "hybrid", reference_target: "same_corpus"

    ERROR 4 - Incomplete verbatim_text:
    BAD:  verbatim_text: "an agency or organization that contracts with the Department" (truncated)
    GOOD: verbatim_text: "an agency or organization that contracts with the Department of Human Services to assist in the voluntary registration..." (full text)

    FALSE POSITIVE 1 - Incorporation by reference (DO NOT EXTRACT):
    SOURCE: The definitions in N.J.A.C. 3A:11, Service Delivery General Provisions,
            are hereby incorporated into this chapter by reference.
    DO NOT EXTRACT: This is not defining a term, it's incorporating multiple definitions.

    FALSE POSITIVE 2 - Procedural text (DO NOT EXTRACT):
    SOURCE: If a resident has a court appointed guardian, consult with that guardian...
    DO NOT EXTRACT: "court appointed guardian" is used but not defined here.

    FALSE POSITIVE 3 - Capitalized but not defined (DO NOT EXTRACT):
    SOURCE: If the resident has executed a DNR clause as part of an Advance Directive...
    DO NOT EXTRACT: "Advance Directive" is referenced as a known term, not defined.

  # User message template (varies per request)
  template: |
    Extract all term definitions from this regulation section.

    TITLE: {title}
    CONTENT (first 3000 chars):
    {content}

    For each definition found, extract:
    - term: The term being defined (noun phrase, not a number)
    - verbatim_text: The EXACT text from the regulation (without "X means..." prefix)
    - is_verbatim_text_complete: true if verbatim_text is complete and usable, false otherwise
    - rephrased_definition: (optional) Plain-language definition when verbatim_text is not self-explanatory
    - scope: The scope text (e.g., "in this Part", "in this section")
    - source_location: Where it appears (e.g., "section 1.1", "definitions section")
    - scope_level: The hierarchy level from scope phrase (section/part/chapter/title/null)
    - definition_type: "formal" or "abbreviation"
    - is_cross_reference: true if this points to another source for the definition
    - reference_completeness: (only if is_cross_reference) "pure_pointer" or "hybrid"
    - reference_target: (only if is_cross_reference) "same_corpus", "federal", "external_standard", or "other"

    Remember: When uncertain, DO NOT extract. False negatives are acceptable; false positives are not.


# =============================================================================
# COMPLIANCE ISSUE DETECTION PROMPTS
# =============================================================================
#
# These prompts are used by the compliance issue searcher to verify
# regex-matched candidates with LLM analysis. Each issue type has:
# - system: Static instructions (cached across batch requests)
# - template: Dynamic user prompt with {regulation_context} and {statute_context}

# -----------------------------------------------------------------------------
# WET SIGNATURE DETECTION
# -----------------------------------------------------------------------------
compliance_wet_signature:
  description: |
    Analyzes regulations to determine if they require wet (physical/ink) signatures,
    distinguishing between explicit wet signature requirements and generic signature
    language that allows electronic signatures.

  system: |
    You analyze regulations to determine if they require WET SIGNATURES.

    A "wet signature" requirement means the text EXPLICITLY requires one of:
    - "wet signature"
    - "original signature"
    - "ink signature"
    - "handwritten signature"
    - "physical signature"
    - "signed in ink"
    - "manually signed"
    - Explicit prohibition of electronic/digital/fax signatures

    IMPORTANT: Generic phrases like "shall be signed", "must be signed", "signature required",
    or "bear the signature of" do NOT count as wet signature requirements. These allow
    electronic signatures under modern law (UETA, E-SIGN Act).

    When statute text is provided, determine whether the wet signature requirement
    originates from the statute or is added by the regulation.

    Respond with:
    - has_issue: true ONLY if there is an EXPLICIT wet/ink/handwritten/original/physical requirement
    - requirement_quote: exact quote establishing the requirement (extract even if not a wet signature)
    - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute provided
    - notes: any additional context

  template: |
    Analyze this regulation for wet signature requirements:

    REGULATION TEXT:
    {regulation_context}

    STATUTE CONTEXT:
    {statute_context}


# -----------------------------------------------------------------------------
# MAIL-ONLY SUBMISSION DETECTION
# -----------------------------------------------------------------------------
compliance_mail_only:
  description: |
    Analyzes regulations to determine if mail is the ONLY permitted submission method,
    or whether electronic/online submission is also offered as an alternative.

  system: |
    You analyze regulations to determine if MAIL is the ONLY permitted submission method.

    This is a compliance issue when:
    - Mail is explicitly required as the ONLY submission method
    - No electronic/online alternative is mentioned
    - The regulation says things like "must be mailed", "submit by mail only"

    This is NOT a compliance issue when:
    - Mail is offered as ONE option among several (including electronic)
    - The regulation mentions email, online portal, electronic submission as alternatives
    - Mail is mentioned for context but not as a requirement

    Keywords to look for: "by mail," "mailed to," "send by mail," "submit by mail,"
    "mail the original," "mailing address," "postal," "U.S. mail," "USPS"

    Respond with:
    - has_issue: true if mail is the ONLY permitted method, false if electronic is available
    - requirement_quote: exact quote about the mail requirement
    - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
    - alternative_methods: other submission methods mentioned (if any)
    - notes: any additional context

  template: |
    Analyze this regulation for mail-only submission requirements:

    REGULATION TEXT:
    {regulation_context}

    STATUTE CONTEXT:
    {statute_context}

    Determine whether mail is the ONLY permitted submission method, or whether
    electronic/online submission is also offered as an alternative.


# -----------------------------------------------------------------------------
# CERTIFIED/REGISTERED MAIL DETECTION
# -----------------------------------------------------------------------------
compliance_certified_mail:
  description: |
    Analyzes regulations for certified or registered mail requirements,
    distinguishing between those with clear legal rationale vs unnecessary burden.

  system: |
    You analyze regulations for CERTIFIED or REGISTERED MAIL requirements.

    This is a compliance issue when:
    - Certified/registered mail is required for routine correspondence
    - The requirement appears to add unnecessary burden
    - Regular mail or electronic communication would suffice

    This may NOT be a compliance issue when there's clear legal rationale:
    - Establishing a legally significant deadline (e.g., appeal periods)
    - Serving legal notice where proof of delivery is required by statute
    - Formal contract termination or legal process requirements

    Keywords: "certified mail," "registered mail," "return receipt,"
    "delivery confirmation," "postmarked by," "proof of mailing," "certificate of mailing"

    Respond with:
    - has_issue: true if requirement appears unnecessary, false if clear legal rationale exists
    - requirement_quote: exact quote about the mail requirement
    - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
    - legal_rationale: the legal purpose if one is apparent
    - notes: any additional context

  template: |
    Analyze this regulation for certified/registered mail requirements:

    REGULATION TEXT:
    {regulation_context}

    STATUTE CONTEXT:
    {statute_context}

    Determine whether the certified mail requirement serves a clear legal purpose
    or appears to be unnecessary burden for routine correspondence.


