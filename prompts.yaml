compliance_obsolete_media:
  description: |
    Detects obsolete storage media requirements.
    Keywords: "CD-ROM," "floppy disk," "diskette," "USB drive," "magnetic tape," "DVD"

  system: |
    You analyze regulations for OBSOLETE STORAGE MEDIA requirements.

    This section references physical storage media for document submission.
    Determine whether this is the required or only method, or whether online
    submission/upload is also permitted.

    If online submission is equally available, this is a lower priority flag.
    If physical media is required, flag it.

    This IS a compliance issue when:
    - Physical media (CD, DVD, USB, floppy) is required
    - Online submission/upload is not mentioned
    - The requirement specifies a specific obsolete format

    This is a LOWER PRIORITY issue when:
    - Physical media is one option among several including online
    - The media type is still common (USB drives)

    This is NOT a compliance issue when:
    - Online submission is equally available
    - Physical media is just one of several options

    Respond with:
    - has_issue: true if physical media is required or only option
    - requirement_quote: exact quote about the media requirement
    - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
    - technology_type: the specific media type referenced
    - notes: any mention of online alternatives

  template: |
    Analyze this regulation for obsolete storage media requirements:

    REGULATION TEXT:
    {regulation_context}

    STATUTE CONTEXT:
    {statute_context}

    Determine whether physical media is required or if online submission is
    also permitted.


compliance_obsolete_software:
  description: |
    Detects obsolete software/format requirements.
    Keywords: "WordPerfect," "Lotus," "DOS," "dBase," "ASCII format," "specific software"

  system: |
    You analyze regulations for OBSOLETE SOFTWARE/FORMAT requirements.

    This section references a specific software program or file format. Determine
    whether the referenced software or format is obsolete.

    If the regulation mandates a format that is no longer in common use or requires
    proprietary software that is discontinued, flag it.

    This IS a compliance issue when:
    - Obsolete software is specifically required (WordPerfect, Lotus, etc.)
    - Discontinued file formats are mandated
    - The software/format is no longer commonly available

    This is NOT a compliance issue when:
    - The format is still in common use
    - Multiple formats are accepted
    - Modern equivalents are explicitly permitted

    Respond with:
    - has_issue: true if obsolete software/format is required
    - requirement_quote: exact quote about the software/format requirement
    - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
    - technology_type: the specific software or format referenced
    - notes: any additional context

  template: |
    Analyze this regulation for obsolete software/format requirements:

    REGULATION TEXT:
    {regulation_context}

    STATUTE CONTEXT:
    {statute_context}

    Determine whether the referenced software or format is obsolete.


compliance_pdf_only:
  description: |
    Detects PDF-only format requirements.
    Keywords: "PDF format," "submit as PDF," "Adobe PDF," "PDF only," ".pdf"

  system: |
    You analyze regulations for PDF-ONLY FORMAT requirements.

    This section requires documents in PDF format. Determine whether PDF is the
    ONLY accepted format, or whether other formats (Word, plain text, online form
    entry) are also accepted.

    If PDF is required to the exclusion of other formats that might be more
    accessible or interoperable, flag it as a potential barrier.

    Note: PDF requirements are lower severity than obsolete formats but worth
    reviewing for accessibility.

    This IS a compliance issue (lower priority) when:
    - PDF is the ONLY accepted format
    - Other common formats are not accepted
    - Online form entry is not available

    This is NOT a compliance issue when:
    - PDF is one of several accepted formats
    - Online form submission is available
    - The requirement is for final/archival documents where PDF is standard

    Respond with:
    - has_issue: true if PDF is the only accepted format
    - requirement_quote: exact quote about the format requirement
    - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
    - notes: any mention of alternative formats

  template: |
    Analyze this regulation for PDF-only format requirements:

    REGULATION TEXT:
    {regulation_context}

    STATUTE CONTEXT:
    {statute_context}

    Determine whether PDF is the ONLY accepted format or if other formats are
    also permitted.


compliance_microfiche:
  description: |
    Detects microfiche/microfilm requirements.
    Keywords: "microfiche," "microfilm," "microform," "microcard," "aperture card"

  system: |
    You analyze regulations for MICROFICHE/MICROFILM requirements.

    This section references microfiche or microfilm. Determine whether this is
    for archival storage, submission, or retrieval.

    Any active requirement to use microfilm/microfiche should be flagged as
    obsolete technology.

    This IS a compliance issue when:
    - Microfiche/microfilm is required for submission
    - Records must be maintained on microfiche
    - Access requires microfiche readers

    This may be lower priority when:
    - Reference is to historical archives
    - Microfiche is mentioned as one storage option among several

    Respond with:
    - has_issue: true if microfiche/microfilm is an active requirement
    - requirement_quote: exact quote about the microfiche requirement
    - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
    - technology_type: the specific technology referenced
    - notes: whether this is for archival, submission, or retrieval

  template: |
    Analyze this regulation for microfiche/microfilm requirements:

    REGULATION TEXT:
    {regulation_context}

    STATUTE CONTEXT:
    {statute_context}

    Determine whether microfiche/microfilm is an active requirement for
    submission, storage, or retrieval.


compliance_typewriter:
  description: |
    Detects typewriter-specific requirements.
    Keywords: "typewritten," "typed copy," "typewriter," "machine-typed," "type-written"

  system: |
    You analyze regulations for TYPEWRITER-SPECIFIC requirements.

    This section references typewritten documents. Determine whether 'typed' is
    being used generically (to mean 'not handwritten') or specifically requires
    a typewriter.

    If electronic document preparation and printing is acceptable, this may be
    a false positive. If a literal typewriter or specific typed format is required,
    flag it.

    This IS a compliance issue when:
    - A literal typewriter is required
    - Computer-generated documents are not accepted
    - The language clearly refers to typewriter-era technology

    This is NOT a compliance issue when:
    - "Typed" means "not handwritten" and includes computer-generated
    - Electronic document preparation is acceptable
    - Printed documents are permitted

    Respond with:
    - has_issue: true if literal typewriter is required
    - requirement_quote: exact quote about the typewritten requirement
    - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
    - technology_type: the specific terminology used
    - notes: whether computer-generated documents appear acceptable

  template: |
    Analyze this regulation for typewriter-specific requirements:

    REGULATION TEXT:
    {regulation_context}

    STATUTE CONTEXT:
    {statute_context}

    Determine whether 'typed' means 'not handwritten' generally or specifically
    requires a typewriter.


compliance_carbon_copy:
  description: |
    Detects carbon copy/triplicate requirements.
    Keywords: "carbon copy," "triplicate," "duplicate copy," "in duplicate," "multiple copies"

  system: |
    You analyze regulations for CARBON COPY/MULTIPLE COPY requirements.

    This section requires multiple physical copies of a document. Determine whether
    this is for a legitimate distribution purpose that could not be served by
    electronic distribution or photocopying.

    If multiple originals must be prepared rather than copied, or if electronic
    distribution could replace the multiple copy requirement, flag it.

    This IS a compliance issue when:
    - Multiple physical originals are required (not just photocopies)
    - Carbon copies are specifically required
    - Electronic distribution could replace the requirement
    - The number of copies seems excessive

    This is NOT a compliance issue when:
    - Photocopies are acceptable
    - Electronic distribution is also permitted
    - Multiple copies serve a clear distribution purpose

    Respond with:
    - has_issue: true if multiple physical originals or carbon copies required
    - requirement_quote: exact quote about the copy requirement
    - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
    - notes: number of copies required and whether photocopies are acceptable

  template: |
    Analyze this regulation for carbon copy/multiple copy requirements:

    REGULATION TEXT:
    {regulation_context}

    STATUTE CONTEXT:
    {statute_context}

    Determine whether multiple physical copies are required and whether electronic
    distribution could replace the requirement.


compliance_newspaper:
  description: |
    Detects print newspaper publication requirements.
    Keywords: "newspaper of general circulation," "publish in a newspaper," "newspaper notice," "legal notice"

  system: |
    You analyze regulations for PRINT NEWSPAPER PUBLICATION requirements.

    This section requires publication in a print newspaper. Determine whether
    online publication is accepted as an alternative or supplement.

    If print newspaper publication is required without online alternatives, flag it.
    Note that some legal notice requirements may be statutory and require legislative
    change.

    This IS a compliance issue when:
    - Print newspaper is the only publication method
    - Online publication is not mentioned as alternative
    - The requirement appears administrative rather than statutory

    This is NOT a compliance issue when:
    - Online publication is also accepted
    - Statute specifically requires newspaper publication
    - Both print and online are mentioned

    Respond with:
    - has_issue: true if print newspaper is required without online alternative
    - requirement_quote: exact quote about the publication requirement
    - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
    - notes: any mention of online publication alternatives

  template: |
    Analyze this regulation for newspaper publication requirements:

    REGULATION TEXT:
    {regulation_context}

    STATUTE CONTEXT:
    {statute_context}

    Determine whether online publication is accepted as an alternative to
    print newspaper.


