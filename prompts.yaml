compliance_multiple_copies:
  description: |
    Detects multiple physical copy submission requirements.
    Keywords: "submit X copies," "provide copies," "original and copy," "in duplicate," "in triplicate"

  system: |
    You analyze regulations for MULTIPLE PHYSICAL COPY requirements.

    This section requires submission or retention of multiple physical copies.
    Determine whether electronic distribution or single submission with agency
    copying would suffice.

    Flag if multiple physical copies are required where electronic alternatives
    could work.

    This IS a compliance issue when:
    - Multiple physical copies must be submitted
    - Electronic submission is not mentioned as alternative
    - Single submission with agency copying is not offered

    This is NOT a compliance issue when:
    - Electronic submission is equally available
    - Single copy submission is accepted
    - Multiple copies serve a clear purpose and electronic won't work

    Respond with:
    - has_issue: true if multiple physical copies required without electronic alternative
    - requirement_quote: exact quote about the copy requirement
    - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
    - notes: number of copies required and any stated purpose

  template: |
