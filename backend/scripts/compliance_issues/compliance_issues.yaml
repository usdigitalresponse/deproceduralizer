# =============================================================================
# Compliance Issue Definitions
# =============================================================================
#
# Single source of truth for all compliance issue types.
# Each issue type defines: metadata, regex patterns, and LLM prompt.
#
# Structure:
#   <issue_name>:
#     display_name: Human-readable name
#     db_issue_type: Value stored in database
#     category: Grouping category
#     description: Brief description
#     response_model: Pydantic model name (defined in models.py)
#     patterns: List of regex patterns (case-insensitive)
#     prompt:
#       system: Static LLM instructions (cached)
#       template: Dynamic template with {regulation_context} and {statute_context}
#

# =============================================================================
# COMMUNICATION & SUBMISSION METHODS
# =============================================================================

mail_only:
  display_name: "Mail-Only Submission"
  db_issue_type: "mail_only"
  category: "Communication"
  description: "Mail required with no electronic alternative"
  response_model: "MailOnlyAnalysis"
  patterns:
    - "must be mailed"
    - "shall be mailed"
    - "send by mail"
    - "submit.{0,20}by mail"
    - "mail.{0,10}only"
    - "u\\.?s\\.?\\s*mail"
    - "\\busps\\b"
    - "first.{0,10}class.{0,10}mail"
    - "postal.{0,10}service"
    - "postmarked by"
  prompt:
    system: |
      You analyze regulations for MAIL-ONLY SUBMISSION requirements.

      This section contains references to mailing documents. Determine whether mail
      is the ONLY permitted submission method, or whether electronic/online submission
      is also offered as an alternative.

      If electronic submission is equally permitted, this is a false positive.
      Only flag if mail appears to be required or is the only option mentioned.

      This IS a compliance issue when:
      - Mail is explicitly required as the ONLY submission method
      - No electronic/online alternative is mentioned
      - The regulation says things like "must be mailed", "submit by mail only"

      This is NOT a compliance issue when:
      - Mail is offered as ONE option among several (including electronic)
      - The regulation mentions email, online portal, electronic submission as alternatives
      - Mail is mentioned for context but not as a requirement

      Respond with:
      - has_issue: true if mail is the ONLY permitted method, false if electronic is available
      - requirement_quote: exact quote about the mail requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - alternative_methods: other submission methods mentioned (if any)
      - notes: any additional context

    template: |
      Analyze this regulation for mail-only submission requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether mail is the ONLY permitted submission method, or whether
      electronic/online submission is also offered as an alternative.


certified_mail:
  display_name: "Certified/Registered Mail"
  db_issue_type: "certified_mail"
  category: "Communication"
  description: "Certified or registered mail required"
  response_model: "CertifiedMailAnalysis"
  patterns:
    - "certified mail"
    - "registered mail"
    - "return receipt"
    - "delivery confirmation"
    - "postmarked by"
    - "proof of mailing"
    - "certificate of mailing"
    - "by certified"
    - "via certified"
  prompt:
    system: |
      You analyze regulations for CERTIFIED/REGISTERED MAIL requirements.

      This section references certified or registered mail. Determine whether this
      requirement serves a clear legal purpose (e.g., establishing a legally significant
      deadline, serving legal notice where proof of delivery is required by statute).

      If the certified mail requirement appears to be for routine correspondence where
      regular mail or email would suffice, flag it. If there's a clear legal rationale
      for proof of delivery, this may be a false positive.

      This IS a compliance issue when:
      - Certified/registered mail is required for routine correspondence
      - The requirement appears to add unnecessary burden
      - Regular mail or electronic communication would suffice

      This may NOT be a compliance issue when there's clear legal rationale:
      - Establishing a legally significant deadline (e.g., appeal periods)
      - Serving legal notice where proof of delivery is required by statute
      - Formal contract termination or legal process requirements

      Respond with:
      - has_issue: true if requirement appears unnecessary, false if clear legal rationale exists
      - requirement_quote: exact quote about the mail requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - legal_rationale: the legal purpose if one is apparent
      - notes: any additional context

    template: |
      Analyze this regulation for certified/registered mail requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether the certified mail requirement serves a clear legal purpose
      or appears to be unnecessary burden for routine correspondence.


fax:
  display_name: "Fax Requirements"
  db_issue_type: "fax_required"
  category: "Communication"
  description: "Fax required or only alternative to mail"
  response_model: "FaxAnalysis"
  patterns:
    - "\\bfax\\b"
    - "facsimile"
    - "telefax"
  prompt:
    system: |
      You analyze regulations for FAX submission requirements.

      This section references fax transmission. Determine whether fax is the ONLY
      permitted submission method, or whether it is offered as one option among
      others including electronic/online submission.

      If fax is merely one of several options including modern digital alternatives,
      this is a lower priority flag. If fax is required or is the only alternative
      to physical mail, flag it.

      This IS a compliance issue when:
      - Fax is REQUIRED as the submission method
      - Fax is the ONLY alternative to physical mail (no modern digital options)
      - The regulation mandates fax for certain communications

      This is NOT (or lower priority) compliance issue when:
      - Fax is offered as ONE option among several including modern alternatives
      - Email, online portal, or electronic submission is equally available
      - Fax is mentioned for contact info but not required

      Respond with:
      - has_issue: true if fax is required or only alternative to mail, false if modern options exist
      - requirement_quote: exact quote about the fax requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - alternative_methods: other submission methods mentioned (if any)
      - notes: any additional context

    template: |
      Analyze this regulation for fax requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether fax is required or is the only alternative to physical mail,
      or whether modern digital alternatives are equally available.


obsolete_comm:
  display_name: "Obsolete Communication"
  db_issue_type: "obsolete_comm"
  category: "Communication"
  description: "Telegram, telex, pager references"
  response_model: "ObsoleteTechAnalysis"
  patterns:
    - "telegram"
    - "telegraph"
    - "\\btelex\\b"
    - "\\bpager\\b"
    - "\\bbeeper\\b"
  prompt:
    system: |
      You analyze regulations for references to OBSOLETE COMMUNICATION TECHNOLOGY.

      This section references an obsolete communication technology. Confirm that the
      reference is to an actual requirement or permitted method for current processes,
      rather than a historical reference, definition, or exemption clause.

      If it is an active requirement or the only listed option for a current process,
      flag it.

      This IS a compliance issue when:
      - The reference is to an ACTIVE requirement or permitted method for current processes
      - The regulation relies on obsolete technology that should be updated

      This is NOT a compliance issue when:
      - The reference is historical or definitional
      - It's an exemption clause ("except for telegrams sent before...")
      - It's part of a list that includes modern alternatives

      Respond with:
      - has_issue: true if obsolete tech is an active requirement, false if historical/definitional
      - requirement_quote: exact quote referencing the technology
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - technology_type: the obsolete technology referenced
      - notes: any additional context

    template: |
      Analyze this regulation for obsolete technology references:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether the reference to obsolete technology (telegram, telex, pager, etc.)
      is an active requirement or permitted method, or just historical/definitional.


landline:
  display_name: "Landline/Telephone Required"
  db_issue_type: "landline"
  category: "Communication"
  description: "Telephone/landline required"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "\\blandline\\b"
    - "touch-tone"
    - "by telephone"
    - "telephone call"
    - "verbal authorization"
    - "oral authorization"
    - "by phone"
  prompt:
    system: |
      You analyze regulations for LANDLINE/TELEPHONE-SPECIFIC requirements.

      This section references telephone communication. Determine whether a phone call
      is REQUIRED for a process that could reasonably be handled online or in writing,
      or whether it is simply offered as one contact option among many.

      Flag only if a phone call is mandated for something that could be accomplished
      through a web form or written submission.

      This IS a compliance issue when:
      - A phone call is REQUIRED (not optional)
      - The process could reasonably be handled online or in writing
      - No modern alternatives (web form, email, online portal) are mentioned

      This is NOT a compliance issue when:
      - Telephone is just one contact option among several
      - Phone is offered as a convenience, not a requirement
      - The nature of the interaction genuinely requires verbal communication

      Respond with:
      - has_issue: true if phone call is mandated for something that could be done online/in writing
      - requirement_quote: exact quote establishing the telephone requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context

    template: |
      Analyze this regulation for landline/telephone requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether a phone call is REQUIRED for a process that could reasonably
      be handled online or in writing.


# =============================================================================
# PAYMENT
# =============================================================================

check_payment:
  display_name: "Check/Money Order Payment"
  db_issue_type: "check_payment"
  category: "Payment"
  description: "Check or money order payment required"
  response_model: "PaymentAnalysis"
  patterns:
    - "money order"
    - "certified check"
    - "cashier.{0,3}s? check"
    - "personal check"
    - "payable to"
  prompt:
    system: |
      You analyze regulations for CHECK/MONEY ORDER payment requirements.

      This section references payment by check or money order. Determine whether this
      is the ONLY permitted payment method, or whether credit card, debit card, ACH,
      or online payment options are also available.

      If modern electronic payment is equally permitted, this is a false positive.
      Flag only if check/money order appears to be required or is the only option.

      This IS a compliance issue when:
      - Check or money order is the ONLY payment method mentioned
      - Electronic payment methods are not offered as alternatives
      - The language suggests check/money order is required

      This is NOT a compliance issue when:
      - Check is one option among several including electronic payment
      - Credit card, debit, ACH, or online payment is also mentioned
      - The regulation just provides payment address without mandating method

      Respond with:
      - has_issue: true if check/money order is required or only option
      - requirement_quote: exact quote about the payment requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context

    template: |
      Analyze this regulation for check/money order payment requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether check/money order is the ONLY payment method, or whether
      electronic payment options are also available.


cash_only:
  display_name: "Cash Only Payment"
  db_issue_type: "cash_only"
  category: "Payment"
  description: "Cash-only payment required"
  response_model: "PaymentAnalysis"
  patterns:
    - "cash.{0,5}only"
    - "exact change"
  prompt:
    system: |
      You analyze regulations for CASH-ONLY payment requirements.

      This section references cash payment. Confirm that cash is REQUIRED or is the
      only payment option, rather than simply being one of several accepted methods.

      If electronic payment methods are also accepted, this is a false positive.

      This IS a compliance issue when:
      - Cash is explicitly required ("cash only")
      - Exact change is required with no alternatives
      - No electronic or check payment options are mentioned

      This is NOT a compliance issue when:
      - Cash is one accepted method among several
      - Electronic payment is also available
      - The reference is incidental rather than a requirement

      Respond with:
      - has_issue: true if cash is required or only option
      - requirement_quote: exact quote about the cash requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context

    template: |
      Analyze this regulation for cash-only payment requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Confirm whether cash is REQUIRED or is the only payment option.


no_credit_cards:
  display_name: "No Credit Cards"
  db_issue_type: "no_credit_cards"
  category: "Payment"
  description: "Credit cards explicitly not accepted"
  response_model: "PaymentAnalysis"
  patterns:
    - "no credit cards?"
    - "credit cards? not accepted"
    - "cash or check only"
    - "no electronic payment"
  prompt:
    system: |
      You analyze regulations for PROHIBITIONS ON ELECTRONIC PAYMENT.

      This section appears to prohibit or exclude electronic payment methods. Confirm
      that this is an active prohibition rather than outdated language that has been
      superseded by current practice.

      Flag if the prohibition appears to be in force.

      This IS a compliance issue when:
      - Credit/debit cards are explicitly prohibited
      - Electronic payment is explicitly excluded
      - Only cash or check are listed as accepted methods

      This is NOT a compliance issue when:
      - The language is clearly outdated or superseded
      - Other sections or current practice allow electronic payment
      - The prohibition is for a specific narrow purpose with rationale

      Respond with:
      - has_issue: true if electronic payment prohibition is active
      - requirement_quote: exact quote about the prohibition
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context

    template: |
      Analyze this regulation for credit/debit card prohibitions:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Confirm whether the prohibition on electronic payment is active.


in_person_payment:
  display_name: "In-Person Payment"
  db_issue_type: "in_person_payment"
  category: "Payment"
  description: "Payment must be made in person"
  response_model: "PaymentAnalysis"
  patterns:
    - "pay in person"
    - "payment in person"
    - "in.{0,3}person.{0,10}payment"
  prompt:
    system: |
      You analyze regulations for IN-PERSON PAYMENT requirements.

      This section requires payment to be made in person. Determine whether there is
      a clear rationale for in-person payment (e.g., combined with a required in-person
      inspection or identity verification), or whether this is simply a legacy requirement.

      If online or mail-in payment would reasonably suffice, flag it.

      This IS a compliance issue when:
      - In-person payment is required without clear rationale
      - Online or mail payment would reasonably work
      - The in-person requirement appears to be legacy rather than purposeful

      This is NOT a compliance issue when:
      - In-person payment is combined with required inspection or ID verification
      - There is a stated rationale for physical presence
      - Online/mail payment is also offered as an alternative

      Respond with:
      - has_issue: true if in-person payment is required without clear rationale
      - requirement_quote: exact quote about the in-person payment requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context including rationale if present

    template: |
      Analyze this regulation for in-person payment requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether there is a clear rationale for in-person payment.


# =============================================================================
# SIGNATURES & AUTHENTICATION
# =============================================================================

wet_signature:
  display_name: "Wet Signature"
  db_issue_type: "wet_signature"
  category: "Signatures"
  description: "Physical wet/ink signature required"
  response_model: "WetSignatureAnalysis"
  patterns:
    - "wet signature"
    - "ink signature"
    - "handwritten signature"
    - "original signature"
    - "signed in ink"
    - "blue ink"
    - "black ink"
    - "manually signed"
    - "physical signature"
    - "personally sign"
    - "notarized.{0,20}signature"
    - "signature.{0,20}notari"
    - "bear.{0,10}signature"
  prompt:
    system: |
      You analyze regulations for WET/HANDWRITTEN SIGNATURE requirements.

      This section references a signature requirement. Determine whether it specifically
      requires a handwritten/wet/original signature, or whether electronic signatures
      are also permitted.

      If electronic signatures (including typed names, e-signatures, or digital
      certificates) are accepted as alternatives, this is a false positive. Flag only
      if a physical ink signature appears to be required.

      IMPORTANT: A "wet signature" requirement means the text EXPLICITLY requires one of:
      - "wet signature"
      - "original signature"
      - "ink signature"
      - "handwritten signature"
      - "physical signature"
      - "signed in ink"
      - "manually signed"
      - Explicit prohibition of electronic/digital/fax signatures

      Generic phrases like "shall be signed", "must be signed", "signature required",
      or "bear the signature of" do NOT count as wet signature requirements. These
      allow electronic signatures under modern law (UETA, E-SIGN Act).

      Respond with:
      - has_issue: true ONLY if there is an EXPLICIT wet/ink/handwritten/original/physical requirement
      - requirement_quote: exact quote about the signature requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context

    template: |
      Analyze this regulation for wet signature requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether the regulation specifically requires a wet/handwritten signature
      or whether electronic signatures are permitted.


notarization:
  display_name: "Notarization Required"
  db_issue_type: "notarization"
  category: "Signatures"
  description: "Notarization required"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "must be notarized"
    - "shall be notarized"
    - "duly notarized"
    - "\\bnotarized\\b"
    - "notary public"
    - "sworn.{0,20}before"
    - "acknowledged before"
    - "\\bjurat\\b"
  prompt:
    system: |
      You analyze regulations for NOTARIZATION requirements.

      This section requires notarization. Determine whether:
      (1) the notarization serves a clear legal purpose required by statute for this type of document,
      (2) remote online notarization is permitted as an alternative, or
      (3) the requirement appears to be administrative rather than legally mandated.

      Flag if notarization appears to be an administrative addition rather than a
      statutory requirement, or if remote notarization is not mentioned as an option
      where it could apply.

      This IS a compliance issue when:
      - Notarization is required without clear statutory mandate
      - Remote online notarization is not mentioned as an alternative
      - The requirement appears to be administrative rather than legal necessity

      This is NOT a compliance issue when:
      - Statute specifically requires notarization for this document type
      - Remote online notarization is explicitly permitted
      - There is a clear anti-fraud or identity verification purpose

      Respond with:
      - has_issue: true if notarization appears administrative or remote not permitted
      - requirement_quote: exact quote about the notarization requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context

    template: |
      Analyze this regulation for notarization requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether notarization serves a clear legal purpose and whether
      remote notarization is permitted.


witness:
  display_name: "Witness Required"
  db_issue_type: "witness"
  category: "Signatures"
  description: "Witness signature required"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "two witnesses"
    - "2 witnesses"
    - "witness.{0,5}signature"
    - "witnessed by"
    - "\\battested\\b"
    - "attestation"
    - "in the presence of"
  prompt:
    system: |
      You analyze regulations for WITNESS requirements.

      This section requires one or more witnesses. Determine whether the witness
      requirement is mandated by statute for this document type (e.g., certain
      contracts, wills), or whether it appears to be an administrative addition.

      Also note how many witnesses are required. Flag if the witness requirement
      appears discretionary or if the number of required witnesses seems excessive
      for the document type.

      This IS a compliance issue when:
      - Witness requirement is not mandated by statute
      - Number of witnesses seems excessive for the document type
      - The requirement appears to be administrative rather than legal necessity

      This is NOT a compliance issue when:
      - Statute specifically requires witnesses for this document type
      - The document type traditionally requires witnesses (wills, certain contracts)
      - There is a clear anti-fraud purpose

      Respond with:
      - has_issue: true if witness requirement appears discretionary or excessive
      - requirement_quote: exact quote about the witness requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: number of witnesses required and any context

    template: |
      Analyze this regulation for witness requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether the witness requirement is mandated by statute or appears
      to be an administrative addition.


embossed_seal:
  display_name: "Embossed Seal/Stamp"
  db_issue_type: "embossed_seal"
  category: "Signatures"
  description: "Embossed or official seal required"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "embossed seal"
    - "raised seal"
    - "impressed seal"
    - "corporate seal"
    - "official seal"
    - "seal.{0,5}affixed"
  prompt:
    system: |
      You analyze regulations for PHYSICAL SEAL/STAMP requirements.

      This section requires a physical seal or stamp. Determine whether this is
      required by statute or whether a digital seal, electronic certification,
      or no seal at all would suffice.

      Flag if the physical seal requirement appears to be administrative rather
      than legally mandated.

      This IS a compliance issue when:
      - Physical seal is required without statutory mandate
      - Digital seal or electronic certification would suffice
      - The requirement appears to be formality rather than necessity

      This is NOT a compliance issue when:
      - Statute specifically requires physical seal for this document type
      - The seal serves a clear authentication purpose
      - Digital alternatives are explicitly permitted

      Respond with:
      - has_issue: true if physical seal appears administrative or unnecessary
      - requirement_quote: exact quote about the seal requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any additional context

    template: |
      Analyze this regulation for embossed seal/stamp requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether the physical seal requirement is legally mandated or
      could be replaced by digital certification.


original_document:
  display_name: "Original Document Required"
  db_issue_type: "original_document"
  category: "Signatures"
  description: "Original document required (no copies)"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "no photocopies"
    - "original only"
    - "submit.{0,10}original"
    - "provide.{0,10}original"
    - "original document"
    - "original certificate"
    - "original letter"
    - "must be.{0,5}original"
    - "shall be.{0,5}original"
  prompt:
    system: |
      You analyze regulations for ORIGINAL DOCUMENT requirements.

      This section requires an original document. Determine whether there is a clear
      legal rationale for requiring the original (e.g., preventing fraud in negotiable
      instruments, chain of custody for evidence), or whether a photocopy, scanned
      copy, or certified copy would reasonably suffice.

      Flag if the original requirement appears to be administrative rather than
      serving a clear anti-fraud purpose.

      This IS a compliance issue when:
      - Original is required without anti-fraud rationale
      - A photocopy or scanned copy would reasonably suffice
      - The requirement appears to be administrative

      This is NOT a compliance issue when:
      - Document is a negotiable instrument or has chain-of-custody requirements
      - There is clear anti-fraud or authentication purpose
      - The document type inherently requires original (e.g., checks, bonds)

      Respond with:
      - has_issue: true if original requirement appears administrative
      - requirement_quote: exact quote about the original document requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any rationale for original requirement if stated

    template: |
      Analyze this regulation for original document requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether requiring the original serves a clear anti-fraud purpose
      or whether copies would suffice.


# =============================================================================
# PHYSICAL PRESENCE & ACCESS
# =============================================================================

in_person_submission:
  display_name: "In-Person Submission"
  db_issue_type: "in_person_submission"
  category: "Physical Presence"
  description: "Physical presence required for submission"
  response_model: "InPersonAnalysis"
  patterns:
    - "submit.{0,10}in person"
    - "appear in person"
    - "in.{0,3}person.{0,10}submission"
    - "personal appearance"
    - "hand.{0,3}deliver"
  prompt:
    system: |
      You analyze regulations for IN-PERSON SUBMISSION requirements.

      This section requires in-person appearance or submission. Determine whether
      there is a clear rationale for physical presence (e.g., identity verification
      via photo ID, physical inspection, fingerprinting, oath administration).

      If the in-person requirement appears to be for document submission that could
      be handled by mail or electronically, flag it. If there is a legitimate identity
      verification or inspection purpose, note that as context but still flag for
      review of whether remote alternatives exist.

      This IS a compliance issue when:
      - In-person is required for document submission that could be mailed/electronic
      - No clear rationale for physical presence
      - Remote alternatives are not mentioned

      This is NOT a compliance issue when:
      - Physical presence is genuinely necessary (fingerprinting, physical sample)
      - In-person is one option among several including mail/electronic

      Respond with:
      - has_issue: true if in-person appears required without clear rationale
      - requirement_quote: exact quote about the in-person requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any stated rationale for in-person requirement

    template: |
      Analyze this regulation for in-person submission requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether there is a clear rationale for requiring physical presence.


in_person_hearing:
  display_name: "In-Person Hearing/Meeting"
  db_issue_type: "in_person_hearing"
  category: "Physical Presence"
  description: "Physical attendance at hearing required"
  response_model: "InPersonAnalysis"
  patterns:
    - "in.{0,3}person.{0,10}hearing"
    - "appear at.{0,20}hearing"
    - "physical.{0,5}attendance"
    - "attend in person"
    - "appear before.{0,20}board"
    - "appear before.{0,20}commission"
  prompt:
    system: |
      You analyze regulations for IN-PERSON HEARING/MEETING requirements.

      This section requires in-person attendance at a hearing or meeting. Determine
      whether remote participation (video conference, telephone) is offered as an
      alternative.

      If in-person is the only option, flag it for review of whether remote
      participation could be permitted.

      This IS a compliance issue when:
      - In-person attendance is required with no remote option
      - Video conference or telephone participation is not mentioned
      - The nature of the hearing does not require physical presence

      This is NOT a compliance issue when:
      - Remote participation is explicitly permitted
      - The hearing involves physical evidence or inspection
      - Video/phone options are mentioned as alternatives

      Respond with:
      - has_issue: true if in-person is required with no remote alternative
      - requirement_quote: exact quote about the attendance requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any mention of remote participation options

    template: |
      Analyze this regulation for in-person hearing/meeting requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether remote participation (video, telephone) is offered as
      an alternative to in-person attendance.


in_person_pickup:
  display_name: "In-Person Pickup"
  db_issue_type: "in_person_pickup"
  category: "Physical Presence"
  description: "Must pick up in person"
  response_model: "InPersonAnalysis"
  patterns:
    - "pick up in person"
    - "picked up in person"
    - "available for pickup"
    - "available.{0,10}pick.{0,3}up"
  prompt:
    system: |
      You analyze regulations for IN-PERSON PICKUP requirements.

      This section requires documents or permits to be picked up in person. Determine
      whether there is a rationale for physical pickup (e.g., identity verification,
      physical item like a license plate).

      If the item could reasonably be mailed or delivered electronically, flag it.

      This IS a compliance issue when:
      - Document/permit could be mailed or emailed
      - No clear rationale for physical pickup
      - Identity verification could be done through other means

      This is NOT a compliance issue when:
      - Item is physical and cannot be mailed (e.g., license plates)
      - Identity verification requires in-person photo ID check
      - Mailing is also offered as an alternative

      Respond with:
      - has_issue: true if item could reasonably be mailed/delivered electronically
      - requirement_quote: exact quote about the pickup requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any stated rationale for in-person pickup

    template: |
      Analyze this regulation for in-person pickup requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether there is a rationale for physical pickup or if
      mailing/electronic delivery would work.


physical_forms:
  display_name: "Physical Form Retrieval"
  db_issue_type: "physical_forms"
  category: "Physical Presence"
  description: "Forms must be obtained from physical location"
  response_model: "InPersonAnalysis"
  patterns:
    - "forms available at"
    - "forms.{0,10}available.{0,10}at"
    - "obtain forms from"
    - "forms may be obtained"
  prompt:
    system: |
      You analyze regulations for PHYSICAL FORM RETRIEVAL requirements.

      This section indicates forms must be obtained from a physical location.
      Determine whether forms are also available online or by mail.

      If physical retrieval appears to be the only option, flag it.
      If online availability is also mentioned, this is a false positive.

      This IS a compliance issue when:
      - Forms are only available at a physical location
      - Online availability is not mentioned
      - Mailing forms to applicants is not offered

      This is NOT a compliance issue when:
      - Forms are also available online
      - Forms can be mailed upon request
      - Physical availability is in addition to electronic

      Respond with:
      - has_issue: true if physical retrieval is the only option
      - requirement_quote: exact quote about form availability
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any mention of online or mail availability

    template: |
      Analyze this regulation for physical form retrieval requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether forms are also available online or by mail, or only
      at a physical location.


physical_inspection:
  display_name: "Physical Inspection Location"
  db_issue_type: "physical_inspection"
  category: "Physical Presence"
  description: "Documents available for inspection at location"
  response_model: "InPersonAnalysis"
  patterns:
    - "available for public inspection"
    - "public inspection"
    - "open to inspection"
    - "maintain for inspection"
    - "available for review at"
    - "during business hours"
  prompt:
    system: |
      You analyze regulations for PHYSICAL INSPECTION requirements.

      This section requires documents to be maintained at a physical location for
      public inspection. Determine whether online access to the same documents is
      also provided.

      If physical inspection is the only option and the documents could reasonably
      be posted online, flag it. Note that some documents may have legitimate reasons
      for in-person-only access (e.g., security-sensitive materials).

      This IS a compliance issue when:
      - Physical inspection is the only access method
      - Documents could reasonably be posted online
      - Online access is not mentioned

      This is NOT a compliance issue when:
      - Online access is also provided
      - Documents contain security-sensitive information
      - Physical inspection is in addition to online access

      Respond with:
      - has_issue: true if physical inspection is the only option
      - requirement_quote: exact quote about the inspection requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any mention of online access or sensitivity concerns

    template: |
      Analyze this regulation for physical inspection requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether online access is also provided or if physical inspection
      is the only option.


physical_posting:
  display_name: "Physical Posting Required"
  db_issue_type: "physical_posting"
  category: "Physical Presence"
  description: "Signs/notices must be physically posted"
  response_model: "InPersonAnalysis"
  patterns:
    - "conspicuously posted"
    - "conspicuously displayed"
    - "prominently displayed"
    - "prominently posted"
    - "posted on the premises"
    - "posted at all times"
    - "post a notice"
    - "display.{0,10}sign"
    - "visible to the public"
  prompt:
    system: |
      You analyze regulations for PHYSICAL POSTING/DISPLAY requirements.

      This section requires physical posting or display of a notice or sign.
      Determine whether this is in addition to online posting or the only requirement.

      For requirements that serve on-site informational purposes (e.g., safety notices,
      licenses at a business location), physical posting may be appropriate and this
      is a lower priority flag.

      For notices that are primarily informational to the general public rather than
      on-site visitors, flag if online posting is not also required.

      This IS a compliance issue when:
      - Physical posting is the only notification method for public notices
      - Online posting is not mentioned for general public information
      - The notice is primarily for off-site audiences

      This is a LOWER PRIORITY issue when:
      - Physical posting serves on-site safety or informational purposes
      - The notice is for customers/visitors at a physical location
      - License display is required at place of business

      Respond with:
      - has_issue: true if physical posting is required without online alternative for public notices
      - requirement_quote: exact quote about the posting requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: whether this is on-site informational or general public notice

    template: |
      Analyze this regulation for physical posting/display requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether this is in addition to online posting or the only requirement,
      and whether it serves on-site or general public purposes.


bulletin_board:
  display_name: "Bulletin Board"
  db_issue_type: "bulletin_board"
  category: "Physical Presence"
  description: "Bulletin board posting required"
  response_model: "InPersonAnalysis"
  patterns:
    - "bulletin board"
    - "notice board"
    - "community board"
    - "public board"
    - "posted.{0,10}board"
  prompt:
    system: |
      You analyze regulations for PHYSICAL BULLETIN BOARD requirements.

      This section references a physical bulletin board. Determine whether this is
      for posting public notices and whether online alternatives are also mentioned.

      If the bulletin board is the only or primary method of public notice, flag it.

      This IS a compliance issue when:
      - Bulletin board is the only method of public notice
      - Online alternatives are not mentioned
      - The notice is intended for general public

      This is NOT a compliance issue when:
      - Online posting is also required
      - Bulletin board is for internal/workplace notices
      - Multiple notification methods are mentioned

      Respond with:
      - has_issue: true if bulletin board is the only public notice method
      - requirement_quote: exact quote about the bulletin board requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any mention of online alternatives

    template: |
      Analyze this regulation for bulletin board requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether this is the only public notice method or whether online
      alternatives are also mentioned.


# =============================================================================
# TECHNOLOGY & MEDIA
# =============================================================================

obsolete_media:
  display_name: "Obsolete Storage Media"
  db_issue_type: "obsolete_media"
  category: "Technology"
  description: "Floppy disk, CD-ROM, magnetic tape"
  response_model: "ObsoleteTechAnalysis"
  patterns:
    - "floppy.{0,5}disk"
    - "\\bdiskette\\b"
    - "cd-rom"
    - "\\bdvd\\b"
    - "magnetic.{0,5}tape"
    - "usb drive"
    - "flash drive"
    - "punch.{0,5}card"  # Added: 15 matches (some medication blister pack false positives)
  prompt:
    system: |
      You analyze regulations for OBSOLETE STORAGE MEDIA requirements.

      This section references physical storage media for document submission.
      Determine whether this is the required or only method, or whether online
      submission/upload is also permitted.

      If online submission is equally available, this is a lower priority flag.
      If physical media is required, flag it.

      This IS a compliance issue when:
      - Physical media (CD, DVD, USB, floppy) is required
      - Online submission/upload is not mentioned
      - The requirement specifies a specific obsolete format

      This is NOT a compliance issue when:
      - Online submission is equally available
      - Physical media is just one of several options

      Respond with:
      - has_issue: true if physical media is required or only option
      - requirement_quote: exact quote about the media requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - technology_type: the specific media type referenced
      - notes: any mention of online alternatives

    template: |
      Analyze this regulation for obsolete storage media requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether physical media is required or if online submission is
      also permitted.


microfiche:
  display_name: "Microfiche/Microfilm"
  db_issue_type: "microfiche"
  category: "Technology"
  description: "Microfiche or microfilm references"
  response_model: "ObsoleteTechAnalysis"
  patterns:
    - "microfiche"
    - "microfilm"
    - "microform"
    - "aperture card"
  prompt:
    system: |
      You analyze regulations for MICROFICHE/MICROFILM requirements.

      This section references microfiche or microfilm. Determine whether this is
      for archival storage, submission, or retrieval.

      Any active requirement to use microfilm/microfiche should be flagged as
      obsolete technology.

      This IS a compliance issue when:
      - Microfiche/microfilm is required for submission
      - Records must be maintained on microfiche
      - Access requires microfiche readers

      This may be lower priority when:
      - Reference is to historical archives
      - Microfiche is mentioned as one storage option among several

      Respond with:
      - has_issue: true if microfiche/microfilm is an active requirement
      - requirement_quote: exact quote about the microfiche requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - technology_type: the specific technology referenced
      - notes: whether this is for archival, submission, or retrieval

    template: |
      Analyze this regulation for microfiche/microfilm requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether microfiche/microfilm is an active requirement for
      submission, storage, or retrieval.


obsolete_software:
  display_name: "Obsolete Software/Format"
  db_issue_type: "obsolete_software"
  category: "Technology"
  description: "WordPerfect, Lotus, DOS references"
  response_model: "ObsoleteTechAnalysis"
  patterns:
    - "wordperfect"
    - "\\blotus\\b"
    - "\\bdos\\b"
    - "\\bdbase\\b"
    - "ascii.{0,10}format"
  prompt:
    system: |
      You analyze regulations for OBSOLETE SOFTWARE/FORMAT requirements.

      This section references a specific software program or file format. Determine
      whether the referenced software or format is obsolete.

      If the regulation mandates a format that is no longer in common use or requires
      proprietary software that is discontinued, flag it.

      This IS a compliance issue when:
      - Obsolete software is specifically required (WordPerfect, Lotus, etc.)
      - Discontinued file formats are mandated
      - The software/format is no longer commonly available

      This is NOT a compliance issue when:
      - The format is still in common use
      - Multiple formats are accepted
      - Modern equivalents are explicitly permitted

      Respond with:
      - has_issue: true if obsolete software/format is required
      - requirement_quote: exact quote about the software/format requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - technology_type: the specific software or format referenced
      - notes: any additional context

    template: |
      Analyze this regulation for obsolete software/format requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether the referenced software or format is obsolete.


typewriter:
  display_name: "Typewriter Required"
  db_issue_type: "typewriter"
  category: "Technology"
  description: "Typewriter or typewritten document required"
  response_model: "ObsoleteTechAnalysis"
  patterns:
    - "\\btypewriter\\b"
    - "typewritten"
    - "type.{0,3}written"
    - "must be typed"
    - "shall be typed"
  prompt:
    system: |
      You analyze regulations for TYPEWRITER-SPECIFIC requirements.

      This section references typewritten documents. Determine whether 'typed' is
      being used generically (to mean 'not handwritten') or specifically requires
      a typewriter.

      If electronic document preparation and printing is acceptable, this may be
      a false positive. If a literal typewriter or specific typed format is required,
      flag it.

      This IS a compliance issue when:
      - A literal typewriter is required
      - Computer-generated documents are not accepted
      - The language clearly refers to typewriter-era technology

      This is NOT a compliance issue when:
      - "Typed" means "not handwritten" and includes computer-generated
      - Electronic document preparation is acceptable
      - Printed documents are permitted

      Respond with:
      - has_issue: true if literal typewriter is required
      - requirement_quote: exact quote about the typewritten requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - technology_type: the specific terminology used
      - notes: whether computer-generated documents appear acceptable

    template: |
      Analyze this regulation for typewriter-specific requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether 'typed' means 'not handwritten' generally or specifically
      requires a typewriter.


pdf_only:
  display_name: "PDF Only Format"
  db_issue_type: "pdf_only"
  category: "Technology"
  description: "PDF format specifically required"
  response_model: "DocumentFormatAnalysis"
  patterns:
    - "pdf format"
    - "submit as pdf"
    - "adobe pdf"
    - "\\.pdf\\b"
  prompt:
    system: |
      You analyze regulations for PDF-ONLY FORMAT requirements.

      This section requires documents in PDF format. Determine whether PDF is the
      ONLY accepted format, or whether other formats (Word, plain text, online form
      entry) are also accepted.

      If PDF is required to the exclusion of other formats that might be more
      accessible or interoperable, flag it as a potential barrier.

      Note: PDF requirements are lower severity than obsolete formats but worth
      reviewing for accessibility.

      This IS a compliance issue (lower priority) when:
      - PDF is the ONLY accepted format
      - Other common formats are not accepted
      - Online form entry is not available

      This is NOT a compliance issue when:
      - PDF is one of several accepted formats
      - Online form submission is available
      - The requirement is for final/archival documents where PDF is standard

      Respond with:
      - has_issue: true if PDF is the only accepted format
      - requirement_quote: exact quote about the format requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any mention of alternative formats

    template: |
      Analyze this regulation for PDF-only format requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether PDF is the ONLY accepted format or if other formats are
      also permitted.


carbon_copy:
  display_name: "Carbon/Duplicate Copy"
  db_issue_type: "carbon_copy"
  category: "Technology"
  description: "Carbon copy or duplicate required"
  response_model: "DocumentFormatAnalysis"
  patterns:
    - "carbon copy"
    - "carbon.{0,5}copies"
    - "duplicate copy"
    - "duplicate copies"
  prompt:
    system: |
      You analyze regulations for CARBON COPY/MULTIPLE COPY requirements.

      This section requires multiple physical copies of a document. Determine whether
      this is for a legitimate distribution purpose that could not be served by
      electronic distribution or photocopying.

      If multiple originals must be prepared rather than copied, or if electronic
      distribution could replace the multiple copy requirement, flag it.

      This IS a compliance issue when:
      - Multiple physical originals are required (not just photocopies)
      - Carbon copies are specifically required
      - Electronic distribution could replace the requirement
      - The number of copies seems excessive

      This is NOT a compliance issue when:
      - Photocopies are acceptable
      - Electronic distribution is also permitted
      - Multiple copies serve a clear distribution purpose

      Respond with:
      - has_issue: true if multiple physical originals or carbon copies required
      - requirement_quote: exact quote about the copy requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: number of copies required and whether photocopies are acceptable

    template: |
      Analyze this regulation for carbon copy/multiple copy requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether multiple physical copies are required and whether electronic
      distribution could replace the requirement.


newspaper:
  display_name: "Newspaper Publication"
  db_issue_type: "newspaper"
  category: "Technology"
  description: "Newspaper publication required"
  response_model: "BaseComplianceAnalysis"
  patterns:
    - "newspaper of general circulation"
    - "publish.{0,20}newspaper"
    - "published.{0,20}newspaper"
    - "newspaper.{0,10}notice"
    - "newspaper.{0,10}publication"
    - "legal.{0,5}notice"
    - "local newspaper"
    - "official newspaper"
  prompt:
    system: |
      You analyze regulations for PRINT NEWSPAPER PUBLICATION requirements.

      This section requires publication in a print newspaper. Determine whether
      online publication is accepted as an alternative or supplement.

      If print newspaper publication is required without online alternatives, flag it.
      Note that some legal notice requirements may be statutory and require legislative
      change.

      This IS a compliance issue when:
      - Print newspaper is the only publication method
      - Online publication is not mentioned as alternative
      - The requirement appears administrative rather than statutory

      This is NOT a compliance issue when:
      - Online publication is also accepted
      - Statute specifically requires newspaper publication
      - Both print and online are mentioned

      Respond with:
      - has_issue: true if print newspaper is required without online alternative
      - requirement_quote: exact quote about the publication requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: any mention of online publication alternatives

    template: |
      Analyze this regulation for newspaper publication requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether online publication is accepted as an alternative to
      print newspaper.


# =============================================================================
# DOCUMENT FORMAT & HANDLING
# =============================================================================

multiple_copies:
  display_name: "Multiple Copy Submission"
  db_issue_type: "multiple_copies"
  category: "Document Format"
  description: "Multiple physical copies required"
  response_model: "DocumentFormatAnalysis"
  patterns:
    - "\\bin duplicate\\b"
    - "\\bin triplicate\\b"
    - "three copies"
    - "four copies"
    - "five copies"
    - "submit.{0,10}\\d+.{0,10}copies"
    - "original and.{0,10}\\d+.{0,10}cop"
    - "multiple copies"
  prompt:
    system: |
      You analyze regulations for MULTIPLE PHYSICAL COPY requirements.

      This section requires submission or retention of multiple physical copies.
      Determine whether electronic distribution or single submission with agency
      copying would suffice.

      Flag if multiple physical copies are required where electronic alternatives
      could work.

      This IS a compliance issue when:
      - Multiple physical copies must be submitted
      - Electronic submission is not mentioned as alternative
      - Single submission with agency copying is not offered

      This is NOT a compliance issue when:
      - Electronic submission is equally available
      - Single copy submission is accepted
      - Multiple copies serve a clear purpose and electronic won't work

      Respond with:
      - has_issue: true if multiple physical copies required without electronic alternative
      - requirement_quote: exact quote about the copy requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: number of copies required and any stated purpose

    template: |
      Analyze this regulation for multiple copy requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether multiple physical copies are required or if electronic
      submission is also permitted.


paper_specs:
  display_name: "Paper Specifications"
  db_issue_type: "paper_specs"
  category: "Document Format"
  description: "Specific paper size/type required"
  response_model: "DocumentFormatAnalysis"
  patterns:
    - "8\\.?5.{0,5}x.{0,5}11"
    - "letter size"
    - "8\\.?5.{0,5}x.{0,5}14"
    - "legal size"
    - "bond paper"
    - "20 lb"
    - "paper stock"
    - "white paper"
    - "colored paper"
  prompt:
    system: |
      You analyze regulations for PAPER SPECIFICATION requirements.

      This section specifies paper characteristics. Determine whether this is for
      legitimate archival or processing purposes, or whether it appears arbitrary.

      If electronic submission would eliminate the need for paper specifications
      entirely, flag it as part of a broader print-centric process.

      This IS a compliance issue when:
      - Specific paper specifications are required
      - Electronic submission is not available
      - The specifications appear arbitrary

      This is a LOWER PRIORITY issue when:
      - Paper specs are standard (8.5x11 letter size)
      - Archival purposes justify the specs

      This is NOT a compliance issue when:
      - Electronic submission is also available
      - Paper specs are for optional paper submissions

      Respond with:
      - has_issue: true if specific paper specs required without electronic alternative
      - requirement_quote: exact quote about the paper requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: whether electronic submission is mentioned

    template: |
      Analyze this regulation for paper specification requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether paper specifications are required and whether electronic
      submission is available.


photo_specs:
  display_name: "Photo Specifications"
  db_issue_type: "photo_specs"
  category: "Document Format"
  description: "Specific photo size/format required"
  response_model: "DocumentFormatAnalysis"
  patterns:
    - "passport photo"
    - "2.{0,3}x.{0,3}2"
    - "recent photograph"
    - "current photograph"
  prompt:
    system: |
      You analyze regulations for PHOTO SPECIFICATION requirements.

      This section specifies photo requirements. Determine whether the photo
      requirement itself is necessary and whether the specific dimensions are
      standard (e.g., passport-standard 2x2) or unusual.

      Flag if photo submission could reasonably be digital upload rather than
      physical attachment, or if specifications seem arbitrary.

      This IS a compliance issue when:
      - Physical photo attachment is required (no digital upload)
      - Photo specifications are unusual or arbitrary
      - Digital photo submission is not mentioned

      This is NOT a compliance issue when:
      - Digital photo upload is permitted
      - Specifications are standard (passport, ID card sizes)
      - Photo requirement itself serves identity verification purpose

      Respond with:
      - has_issue: true if physical photo required or specs are unusual
      - requirement_quote: exact quote about the photo requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: specific dimensions required and whether digital upload is mentioned

    template: |
      Analyze this regulation for photo specification requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether photo requirements are reasonable and whether digital
      upload is permitted.


letterhead:
  display_name: "Letterhead Required"
  db_issue_type: "letterhead"
  category: "Document Format"
  description: "Official letterhead required"
  response_model: "DocumentFormatAnalysis"
  patterns:
    - "on letterhead"
    - "official letterhead"
    - "company letterhead"
    - "agency letterhead"
  prompt:
    system: |
      You analyze regulations for LETTERHEAD requirements.

      This section requires documents on letterhead. Determine whether this serves
      an authentication purpose that could not be met by electronic submission with
      digital signature or verification, or whether it is a legacy formality.

      Flag if letterhead requirements prevent electronic submission.

      This IS a compliance issue when:
      - Letterhead is required, preventing electronic submission
      - Digital signature or verification is not accepted as alternative
      - The requirement appears to be formality rather than authentication

      This is NOT a compliance issue when:
      - Electronic submission with digital signature is permitted
      - Letterhead is optional or "preferred"
      - The letterhead serves a clear identification purpose

      Respond with:
      - has_issue: true if letterhead prevents electronic submission
      - requirement_quote: exact quote about the letterhead requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: whether electronic alternatives are mentioned

    template: |
      Analyze this regulation for letterhead requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether letterhead is required and whether electronic submission
      with digital signature is permitted as an alternative.


handwriting_specs:
  display_name: "Handwriting Specifications"
  db_issue_type: "handwriting_specs"
  category: "Document Format"
  description: "Specific handwriting requirements"
  response_model: "DocumentFormatAnalysis"
  patterns:
    - "block letters"
    - "print clearly"
    - "print in ink"
    - "hand-printed"
    - "hand printed"
    - "indelib"  # Added: 49 matches - indelible ink/pencil requirements
  prompt:
    system: |
      You analyze regulations for HANDWRITING SPECIFICATION requirements.

      This section specifies handwriting requirements. Determine whether the form
      or process is only available in handwritten format, or whether electronic
      alternatives exist.

      If the regulation assumes handwriting is the only option and electronic form
      submission is not offered, flag it.

      This IS a compliance issue when:
      - Handwritten forms are the only option
      - Electronic form submission is not available
      - The language assumes paper/pen completion

      This is NOT a compliance issue when:
      - Electronic form submission is available
      - Handwriting specs are for optional paper forms
      - The requirements are just for legibility on paper backup

      Respond with:
      - has_issue: true if handwritten forms are the only option
      - requirement_quote: exact quote about the handwriting requirement
      - from_statute: true if requirement is in statute, false if regulation adds it, null if no statute
      - notes: whether electronic form submission is mentioned

    template: |
      Analyze this regulation for handwriting specification requirements:

      REGULATION TEXT:
      {regulation_context}

      STATUTE CONTEXT:
      {statute_context}

      Determine whether handwritten forms are the only option or if electronic
      form submission is available.


binding_required:
  display_name: "Binding Required"
  db_issue_type: "binding_required"
