[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = -v --tb=short
markers =
    llm: tests that make real LLM API calls (cost money, require API key)
    db: tests that require database connection
filterwarnings =
    ignore::DeprecationWarning

# Coverage configuration (run with: pytest --cov)
# Default coverage settings when --cov is passed
[coverage:run]
source = scripts
omit =
    scripts/test_*.py
    scripts/**/test_*.py
    **/conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
show_missing = true
precision = 1
